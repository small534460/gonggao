  <style>
    :root{
      --accent: #60a5fa;
      --accent-2: #3b82f6;

    body{

      background:
        linear-gradient(180deg, rgba(7,16,38,0.6) 0%, rgba(7,16,38,0.6) 100%),
        url('https://free.boltp.com/2026/01/17/696b9e7124a9e.webp') center/cover no-repeat fixed;
      color: #e6eef8;
      display: flex;
      align-items: center;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    .wrap{
      width: 100%;
      max-width: 880px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }
    header{
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .logo{
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;

      box-shadow: 0 6px 18px rgba(96,165,250,0.12);
      flex: 0 0 64px;
    }
    h1{
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.6px;
    }
    .subtitle{

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01));
      border-radius: 10px;

      border: 1px solid rgba(255,255,255,0.02);
      transition: transform .16s ease, box-shadow .16s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover{
      transform: translateY(-6px);
      box-shadow: 0 14px 40px rgba(2,6,23,0.6);
    }
    .card .title{
      font-weight: 600;
      color: #f3f9ff;
      font-size: 15px;
    }
    .card .desc{
      font-size: 13px;
      color: var(--muted);
    }
    footer{
      margin-top: 18px;
      display: flex;
      justify-content: space-between;

      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .small{
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width:520px){
      .logo{width:52px;height:52px;font-size:18px;}
      .wrap{padding:18px;}
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <header>
      <div class="logo">S3</div>
      <div>
        <h1>Small 3 的个人领域</h1>
        <div class="subtitle">公告</div>
      </div>
    </header>

    <section class="content">
      <div class="intro">
        我是 Small 3，这是我的个人领域。这里存放公告。
      </div>

      <h2 style="margin:0 0 10px 0;font-size:14px;color:var(--muted)">—— 公告 ——</h2>

      <ul class="links" aria-label="公告">
        <li>
          <a class="card" href="https://small534460.github.io/" target="_blank" rel="noopener noreferrer">
            <div class="title">————好吧，什么也没有————</div>
            <canvas id="lifeCanvas" width="440" height="440" style="border-radius:12px;box-shadow:0 6px 18px rgba(96,165,250,0.12);margin-top:10px;"></canvas>
            <script>
// --- 生态系统模拟器，满足你的三大需求 ---

const canvas = document.getElementById('lifeCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 440;
const ENTITY_SIZE = 7;
const NUM_ANIMALS = 10;
const NUM_HUNTERS = 2;
const FOOD_MAX = 22;
const FOOD_REFRESH = 14;
const MOVE_SPEED = 1.8;
const HUNTER_SPEED = 2.2;
const DAY_LENGTH = 300;
const NORMAL_NEED = 1;
const HUNTER_NEED = 2;
const NORMAL_BORN = 5;
const HUNTER_BORN = 7;
const BORN_ENERGY_COST = 2;
const ANIMAL_VIEW_DIST = 60;
const HUNTER_VIEW_DIST = 85;
const ESCAPE_FORCE = 3.2;
const HUNTER_ATTACK_DIST = ENTITY_SIZE * 1.7;
const BABY_GUARD_AGE = 1;
const MAX_TOTAL = 60;

// 检查两个实体是否重叠
function isOverlap(x1, y1, x2, y2, radius1 = ENTITY_SIZE, radius2 = ENTITY_SIZE) {
  return Math.hypot(x1 - x2, y1 - y2) < (radius1 + radius2);
}

// 在所有现有实体上随机生成，不重叠（有最大尝试限制，避免死循环）
function randomPosNoOverlap(others, radius = ENTITY_SIZE, maxTries = 80) {
  for (let t = 0; t < maxTries; ++t) {
    const x = Math.random() * (GRID_SIZE - 2 * radius) + radius;
    const y = Math.random() * (GRID_SIZE - 2 * radius) + radius;
    let ok = true;
    for (const o of others) {
      const r2 = o.radius || ENTITY_SIZE;
      if (isOverlap(x, y, o.x, o.y, radius, r2)) { ok = false; break; }
    }
    if (ok) return { x, y };
  }
  // 失败则随机一个位置
  return {
    x: Math.random() * (GRID_SIZE - 2 * radius) + radius,
    y: Math.random() * (GRID_SIZE - 2 * radius) + radius
  };
}

class Food {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = ENTITY_SIZE-2;
  }
}

class Animal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.energy = 2;
    this.type = "normal";
    this.alive = true;
    this.age = 0;
    this.childAge = 0;
    this.radius = ENTITY_SIZE;
  }
  get need() { return NORMAL_NEED; }
  get born() { return NORMAL_BORN; }
  color() { return "#3b82f6"; }
  isChild() { return this.childAge > 0 && this.childAge <= BABY_GUARD_AGE; }
  act(hunters, foods, allEntities) {
    if (!this.alive) return;
    let tx = 0, ty = 0;
    let escape = false;
    for (const h of hunters) {
      const d = Math.hypot(h.x - this.x, h.y - this.y);
      if (d < ANIMAL_VIEW_DIST) {
        tx -= (h.x - this.x);
        ty -= (h.y - this.y);
        escape = true;
      }
    }
    if (!escape) {
      let best = null, bd = 99999;
      for (const f of foods) {
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < bd) { bd = d; best = f; }
      }
      if (best) { tx += (best.x - this.x); ty += (best.y - this.y);}
    } else {
      tx *= ESCAPE_FORCE; ty *= ESCAPE_FORCE;
    }
    const norm = Math.max(1, Math.hypot(tx, ty));
    let nx = this.x + MOVE_SPEED * tx / norm;
    let ny = this.y + MOVE_SPEED * ty / norm;
    // 边界限制
    nx = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, nx));
    ny = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, ny));
    // 碰撞避免
    for (const o of allEntities) {
      if (o === this) continue;
      if (isOverlap(nx, ny, o.x, o.y, this.radius, o.radius)) {
        // 被卡住则原地不动
        return;
      }
    }
    this.x = nx;
    this.y = ny;
  }
}

class Hunter {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.energy = 3;
    this.type = "hunter";
    this.alive = true;
    this.age = 0;
    this.childAge = 0;
    this.radius = ENTITY_SIZE;
  }
  get need() { return HUNTER_NEED; }
  get born() { return HUNTER_BORN; }
  color() { return "#ef4444"; }
  isChild() { return this.childAge > 0 && this.childAge <= BABY_GUARD_AGE; }
  act(animals, foods, allEntities) {
    if (!this.alive) return;
    let best = null, bd = 99999;
    for (const a of animals) {
      if (a.alive && !a.isChild()) {
        const d = Math.hypot(a.x - this.x, a.y - this.y);
        if (d < bd && d < HUNTER_VIEW_DIST) { bd = d; best = a; }
      }
    }
    let nx, ny;
    if (best) {
      const dx = best.x - this.x, dy = best.y - this.y, norm = Math.max(1, Math.hypot(dx, dy));
      nx = this.x + HUNTER_SPEED * dx / norm;
      ny = this.y + HUNTER_SPEED * dy / norm;
    } else {
      let fbest = null, fd = 99999;
      for (const f of foods) {
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < fd) { fd = d; fbest = f;}
      }
      if (fbest) {
        const dx = fbest.x - this.x, dy = fbest.y - this.y, norm = Math.max(1, Math.hypot(dx, dy));
        nx = this.x + HUNTER_SPEED * dx / norm;
        ny = this.y + HUNTER_SPEED * dy / norm;
      } else {
        nx = this.x; ny = this.y;
      }
    }
    nx = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, nx));
    ny = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, ny));
    // 碰撞避免
    for (const o of allEntities) {
      if (o === this) continue;
      if (isOverlap(nx, ny, o.x, o.y, this.radius, o.radius)) {
        // 被卡住则原地不动
        return;
      }
    }
    this.x = nx;
    this.y = ny;
  }
}

// 主体数据
let foods=[], animals=[], hunters=[];
let dayStep=0, ticks=0, totalBorn = 0;

function allEntitiesArr() {
  // 不包括已经死亡的动物和猎人
  return foods.concat(animals.filter(a=>a.alive)).concat(hunters.filter(h=>h.alive));
}

// 食物刷新机制
function replenishFood(force=false) {
  let need = FOOD_REFRESH - foods.length;
  if (need<=0 && !force) return;
  // 如果没有食物则补到FOOD_REFRESH；启动时也补满
  const entities = allEntitiesArr();
  for(let i=0;i<need || (force && foods.length === 0) ;i++){
    // 检查不与已有实体重叠
    let pos = randomPosNoOverlap(entities.concat(foods), ENTITY_SIZE-2);
    let food = new Food(pos.x, pos.y);
    foods.push(food);
    entities.push(food);
  }
}

function init() {
  foods = [];
  animals = [];
  hunters = [];
  dayStep=0; totalBorn=0;
  const entities = [];
  for(let i=0;i<NUM_ANIMALS;i++) {
    let pos = randomPosNoOverlap(entities, ENTITY_SIZE);
    let animal = new Animal(pos.x, pos.y);
    animals.push(animal);
    entities.push(animal);
  }
  for(let i=0;i<NUM_HUNTERS;i++) {
    let pos = randomPosNoOverlap(entities, ENTITY_SIZE);
    let hunter = new Hunter(pos.x, pos.y);
    hunters.push(hunter);
    entities.push(hunter);
  }
  replenishFood(true);
}
init();

function update() {
  ticks++;
  dayStep++;
  const entities = allEntitiesArr();
  // 行动
  for(const a of animals) a.act(hunters, foods, entities);
  for(const h of hunters) h.act(animals, foods, entities);

  // 吃食物
  for(const a of animals) {
    if (!a.alive) continue;
    for (const f of foods) {
      if (isOverlap(a.x,a.y,f.x,f.y,a.radius,f.radius)) {
        foods = foods.filter(food => food !== f);
        a.energy++; break;
      }
    }
  }
  // 猎人吃蓝生物或食物
  for(const h of hunters) {
    if (!h.alive) continue;
    let huntdone = false;
    for (const a of animals) {
      if(a.alive && !a.isChild() && Math.hypot(h.x - a.x, h.y - a.y) < HUNTER_ATTACK_DIST){
        a.alive = false; h.energy += 3; huntdone=true; break;
      }
    }
    if (!huntdone) {
      for (const f of foods) {
        if (isOverlap(h.x,h.y,f.x,f.y,h.radius,f.radius-1)) {
          foods = foods.filter(food => food !== f);
          h.energy+=1; break;
        }
      }
    }
  }

  // 天数步长结算（只做繁殖/死亡判定，食物刷新移除）
  if (dayStep >= DAY_LENGTH) {
    let newbornAnimals=[], newbornHunters=[];
    for (const a of animals) {
      a.age++;
      if (!a.alive) continue;
      a.energy -= a.need;
      if (a.energy < 0) a.alive = false;
      if (a.energy >= a.born && newbornAnimals.length < 3 && (animals.length+hunters.length)<MAX_TOTAL) {
        a.energy -= BORN_ENERGY_COST;
        let pos = randomPosNoOverlap(allEntitiesArr(), ENTITY_SIZE);
        let baby = new Animal(pos.x, pos.y); baby.childAge = 1; newbornAnimals.push(baby);
      }
      if (a.isChild()) a.childAge++;
    }
    for (const h of hunters) {
      h.age++;
      if (!h.alive) continue;
      h.energy -= h.need;
      if (h.energy < 0) h.alive = false;
      if (h.energy >= h.born && newbornHunters.length < 1 && (animals.length+hunters.length)<MAX_TOTAL) {
        h.energy -= BORN_ENERGY_COST + 1;
        let pos = randomPosNoOverlap(allEntitiesArr(), ENTITY_SIZE);
        let baby = new Hunter(pos.x, pos.y); baby.childAge = 1; newbornHunters.push(baby);
      }
      if (h.isChild()) h.childAge++;
    }
    animals = animals.filter(a=>a.alive);
    hunters = hunters.filter(h=>h.alive);
    animals = animals.concat(newbornAnimals);
    hunters = hunters.concat(newbornHunters);
    dayStep = 0;
  }

  // "吃光就补"的食物机制
  if (foods.length === 0) replenishFood(true);

  // 极端增长时收敛保护
  if(foods.length>FOOD_MAX) foods=foods.slice(0,FOOD_MAX);

  animals = animals.filter(a=>a.alive);
  hunters = hunters.filter(h=>h.alive);
}

function render() {
  ctx.clearRect(0,0,GRID_SIZE,GRID_SIZE);
  // 食物
  for(const f of foods){
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2);
    ctx.fillStyle="#34d399";
    ctx.fill();
    ctx.closePath();
  }
  // 普通生物
  for(const a of animals){
    ctx.save(); ctx.globalAlpha=a.isChild()?0.45:1.0;
    ctx.beginPath();
    ctx.arc(a.x,a.y,a.radius,0,Math.PI*2);
    ctx.fillStyle=a.color();
    ctx.fill();
    ctx.closePath();
    ctx.restore();
  }
  // 红色猎人
  for(const h of hunters){
    ctx.save(); ctx.globalAlpha=h.isChild()?0.45:1.0;
    ctx.beginPath();
    ctx.arc(h.x,h.y,h.radius,0,Math.PI*2);
    ctx.fillStyle=h.color();
    ctx.fill();
    ctx.closePath();
    ctx.restore();
  }
  // 计数
  ctx.font="bold 13px Arial";
  ctx.fillStyle="#facc15";
  ctx.fillText(`天数:${ticks ? Math.floor(ticks/DAY_LENGTH)+1 : 1}`,10,20);
  ctx.fillText(`蓝生物: ${animals.length}`,110,20);
  ctx.fillStyle="#ee4444";
  ctx.fillText(`红猎人: ${hunters.length}`,220,20);
  ctx.fillStyle="#14b8a6";
  ctx.fillText(`食物: ${foods.length}`,320,20);
  if (animals.length===0 && hunters.length===0){
    ctx.font = "18px Arial";
    ctx.fillStyle = "#ef4444";
    ctx.fillText("所有生物都灭绝了", 90, 220);
  }
}

// 永远循环，模拟永不停止（除非手动刷新页面）
function loop() {
  update();
  render();
  requestAnimationFrame(loop); // 永远运行
}
loop();
            </script>
          </a>
        </li>
      </ul>
    </section>
