<!DOCTYPE html>
<html lang="zh-CN" data-ui-mode="desktop" data-sheet="closed" data-sheet-tab="layers" data-drawer="closed">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#151823">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🧩 Small Image Generation</title>

  <!-- 首屏之前就判定 UI 模式，避免闪烁；app.js 会复用同一套规则 -->
  <script>
  (function () {
    var root = document.documentElement;
    try {
      var forced = null;
      try { forced = localStorage.getItem('sig.uiMode'); } catch (e) {}
      if (forced === 'auto') forced = null;
      if (/[?&]ui=desktop\b/.test(location.search)) forced = 'desktop';
      if (/[?&]ui=mobile\b/.test(location.search)) forced = 'mobile';

      var ua = navigator.userAgent || '';
      var mobileUA = /Android|iPhone|iPod|Windows Phone|Mobile/i.test(ua);
      var touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
      var fine = window.matchMedia ? window.matchMedia('(any-pointer: fine)').matches : true;
      var w = window.innerWidth, h = window.innerHeight;
      var mode;
      if (forced === 'desktop' || forced === 'mobile') mode = forced;
      else if (mobileUA) mode = 'mobile';
      else if (touch && !fine && Math.min(w, h) <= 900) mode = 'mobile';
      else if (w <= 720) mode = 'mobile';
      else mode = 'desktop';

      root.setAttribute('data-ui-mode', mode);
      root.setAttribute('data-touch', touch ? '1' : '0');
      root.setAttribute('data-forced', forced || 'auto');
    } catch (e) {
      root.setAttribute('data-ui-mode', 'desktop');
      root.setAttribute('data-touch', '0');
      root.setAttribute('data-forced', 'auto');
    }
  })();
  </script>

  <style>
:root{
  --bg:#0e1016;
  --bg2:#151823;
  --bg3:#1d2130;
  --bg4:#262b3d;
  --border:#2b3144;
  --text:#e7eaf2;
  --dim:#8f97ab;
  --accent:#6d8dff;
  --danger:#ff6673;
  --topbar-h:48px;
  --dock-h:58px;
  --sheet-h:58vh;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:13px;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
input,textarea,select{user-select:text;-webkit-user-select:text}
#app{display:flex;flex-direction:column;height:100vh;height:var(--app-h,100dvh)}
.main{flex:1;display:flex;min-height:0;position:relative}

/* ===== 模式可见性：默认按桌面渲染 ===== */
.only-mobile{display:none}

/* ===== 顶栏 ===== */
.topbar{flex:none;height:var(--topbar-h);display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.brand{font-weight:600;font-size:14px;white-space:nowrap}
.spacer{flex:1}
.topbar-group{display:flex;align-items:center;gap:6px}
.dim-label{color:var(--dim);font-size:12px;white-space:nowrap}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 12px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font:inherit;font-size:12.5px;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--bg4);border-color:#3a4158}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#5b7cfa,#7a5cf0);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.12)}
.btn.block{width:100%;margin-top:6px}
.btn.danger-ghost{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger-ghost:hover{background:rgba(255,102,115,.12)}
.btn.mini{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn.icon-lg{padding:6px 10px;font-size:15px;line-height:1}
.tool-btn{flex:1}
.tool-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* ===== 布局（桌面） ===== */
.left-panel{flex:none;width:196px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto}
.right-panel{flex:none;width:272px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.canvas-area{
  flex:1;min-width:0;background:#0a0c12;overflow:auto;
  display:flex;align-items:center;justify-content:center;padding:28px;position:relative;
}
.canvas-area.drop-hint::after{
  content:"松开以添加图片图层";position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(109,141,255,.08);border:2px dashed var(--accent);
  color:var(--accent);font-size:15px;pointer-events:none;
}

/* ===== 画布 ===== */
.canvas-wrap{flex:none}
#canvas{
  display:block;
  background-image:repeating-conic-gradient(#20242f 0% 25%, #171a24 0% 50%);
  background-size:22px 22px;
  box-shadow:0 0 0 1px var(--border), 0 10px 40px rgba(0,0,0,.55);
  touch-action:none;
}

/* ===== 面板 ===== */
.panel-section{padding:12px;border-bottom:1px solid var(--border)}
.panel-section h3{margin:0 0 10px;font-size:11px;color:var(--dim);letter-spacing:1.5px;font-weight:600}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-header h3{margin:0}
.panel-header.second{margin-bottom:6px}
.mini-btns{display:flex;gap:4px}
.mini-btns.wrap{flex-wrap:wrap}
.tool-row{display:flex;gap:6px}

select,input[type="text"],input[type="number"],textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 8px;font:inherit;font-size:12.5px;outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input[type="color"]{
  width:100%;height:30px;padding:2px;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;cursor:pointer;
}
input[type="range"]{width:100%;accent-color:var(--accent);height:22px;cursor:pointer}
input[type="checkbox"]{accent-color:var(--accent)}

/* ===== 属性面板 ===== */
.prop{margin-bottom:10px}
.prop label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
.prop-row{display:flex;gap:8px}
.prop-row .grow{flex:1}
.val-tag{color:var(--accent);float:right}
.seg{display:flex;gap:4px}
.seg button{
  flex:1;padding:5px 4px;font:inherit;font-size:12px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;
}
.seg button:hover{background:var(--bg4)}
.seg button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 0}
.hint{color:var(--dim);line-height:1.7;font-size:12.5px}
.hint.small{font-size:11.5px;margin:6px 0 0}
.bg-group{margin-top:2px}

/* ===== 对齐按钮 ===== */
.align-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.align-btn{padding:7px 0;font-size:14px}

/* ===== 图层列表 ===== */
.layers-section{padding-bottom:8px}
#layerList{list-style:none;margin:0;padding:2px 0;max-height:250px;overflow-y:auto}
#layerList li{
  display:flex;align-items:center;gap:8px;padding:6px 8px;margin:2px 0;
  border-radius:8px;border:1px solid transparent;cursor:pointer;
}
#layerList li:hover{background:var(--bg3)}
#layerList li.active{background:var(--bg4);border-color:var(--accent)}
#layerList li.dragging{opacity:.35}
#layerList .thumb{
  width:38px;height:38px;border-radius:5px;border:1px solid var(--border);flex:none;
  background:repeating-conic-gradient(#20242f 0% 25%, #171a24 0% 50%);
  background-size:10px 10px;
}
#layerList .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.icon-btn{
  flex:none;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--dim);cursor:pointer;border-radius:5px;
  font-size:13px;padding:0;
}
.icon-btn:hover{background:var(--bg4);color:var(--text)}
.icon-btn.del:hover{color:var(--danger)}

.props-section{flex:1;overflow-y:auto}

/* ===== 快捷键 ===== */
.shortcuts{list-style:none;margin:0;padding:0;color:var(--dim);font-size:11.5px;line-height:1.9}
.shortcuts b{
  display:inline-block;min-width:64px;color:var(--text);font-weight:600;
  background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  padding:0 6px;margin-right:6px;text-align:center;
}

/* ===== 状态栏 ===== */
.statusbar{
  flex:none;height:26px;display:flex;align-items:center;padding:0 12px;
  background:var(--bg2);border-top:1px solid var(--border);color:var(--dim);font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== 提示 ===== */
#toast{
  position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(8px);
  background:var(--bg4);border:1px solid var(--accent);color:var(--text);
  padding:9px 18px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.5);
  max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 渐变色标列表 ===== */
.stop-list{margin-bottom:6px}
.stop-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.stop-row .stop-color{flex:none;width:44px;height:28px}
.stop-row .stop-pos{flex:1;min-width:0}
.stop-row .stop-pos-label{flex:none;width:36px;text-align:right;font-size:11px;color:var(--dim)}

/* ===== 滚动条 ===== */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3247;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#39405c}
::-webkit-scrollbar-track{background:transparent}

/* ===== 模态框（桌面 / 移动通用） ===== */
.modal-mask{
  position:fixed;inset:0;z-index:1000;display:none;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(4,6,12,.62);backdrop-filter:blur(2px);
}
.modal-mask.show{display:flex}
.modal-box{
  width:min(420px,94vw);max-height:88vh;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:16px;box-shadow:0 18px 60px rgba(0,0,0,.6);
  animation:modalIn .16s ease-out;
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-box h3{margin:0 0 12px;font-size:14px}
.modal-box .prop{margin-bottom:12px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .btn{flex:1;padding:9px 12px}
.modal-preview{
  width:100%;border-radius:10px;border:1px solid var(--border);margin:4px 0 10px;
  background:repeating-conic-gradient(#20242f 0% 25%, #171a24 0% 50%);background-size:16px 16px;
  max-height:46vh;object-fit:contain;display:block;
}

/* ==========================================================================
   移动端 / 触屏模式（安卓）
   ========================================================================== */
[data-ui-mode="mobile"] .only-desktop{display:none !important}
[data-ui-mode="mobile"] .only-mobile{display:block}
[data-ui-mode="mobile"] button.only-mobile,
[data-ui-mode="mobile"] .btn.only-mobile{display:inline-flex}
[data-ui-mode="mobile"] nav.only-mobile{display:flex}
/* 顶栏按钮组必须保持 flex，否则会丢掉 gap */
[data-ui-mode="mobile"] .topbar-group.only-mobile{display:flex;gap:6px}

[data-ui-mode="mobile"] body{font-size:14px}

/* 顶栏 */
[data-ui-mode="mobile"] .topbar{
  height:calc(var(--topbar-h) + var(--safe-t));
  padding:var(--safe-t) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));
  gap:8px;
}
[data-ui-mode="mobile"] .brand{font-size:13.5px;overflow:hidden}
[data-ui-mode="mobile"] .brand-text{display:inline}
@media (max-width:360px){[data-ui-mode="mobile"] .brand-text{display:none}}

/* 画布区 */
[data-ui-mode="mobile"] .canvas-area{
  padding:12px calc(12px + var(--safe-r)) 12px calc(12px + var(--safe-l));
  align-items:center;justify-content:center;
  -webkit-overflow-scrolling:touch;
}

/* 浮动缩放控件 */
[data-ui-mode="mobile"] .zoom-pill{
  display:flex;position:absolute;right:calc(10px + var(--safe-r));bottom:12px;
  align-items:center;gap:2px;z-index:20;
  background:rgba(21,24,35,.92);border:1px solid var(--border);border-radius:22px;
  padding:4px 6px;box-shadow:0 6px 22px rgba(0,0,0,.5);backdrop-filter:blur(6px);
}
.zoom-pill .zp-btn{
  width:34px;height:34px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);
  font-size:17px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
}
.zoom-pill .zp-btn:active{background:var(--accent)}
.zoom-pill .zp-label{min-width:46px;text-align:center;font-size:12px;color:var(--dim)}
.zoom-pill .zp-fit{
  width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--dim);
  font-size:15px;cursor:pointer;margin-left:2px;
}

/* 左侧抽屉 */
[data-ui-mode="mobile"] .left-panel{
  position:fixed;top:0;bottom:0;left:0;z-index:60;
  width:min(84vw,330px);max-width:330px;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);padding-left:var(--safe-l);
  transform:translateX(-102%);transition:transform .24s ease;
  box-shadow:12px 0 40px rgba(0,0,0,.5);overscroll-behavior:contain;
  display:block;
}
[data-ui-mode="mobile"][data-drawer="open"] .left-panel{transform:translateX(0)}
[data-ui-mode="mobile"] .drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 12px;border-bottom:1px solid var(--border);
  font-size:14px;font-weight:600;position:sticky;top:0;background:var(--bg2);z-index:2;
}
[data-ui-mode="mobile"] .drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;
}
[data-ui-mode="mobile"][data-drawer="closed"] .drawer-backdrop{display:none}
[data-ui-mode="mobile"] .panel-section{padding:14px 12px}

/* 触屏友好的控件尺寸 */
[data-ui-mode="mobile"] select,
[data-ui-mode="mobile"] input[type="text"],
[data-ui-mode="mobile"] input[type="number"],
[data-ui-mode="mobile"] textarea{padding:10px;font-size:14px}
[data-ui-mode="mobile"] input[type="color"]{height:42px}
[data-ui-mode="mobile"] input[type="range"]{height:34px}
[data-ui-mode="mobile"] .btn{padding:9px 14px;font-size:13.5px;border-radius:9px}
[data-ui-mode="mobile"] .btn.mini{padding:7px 10px;font-size:12.5px}
[data-ui-mode="mobile"] .align-btn{padding:12px 0;font-size:17px}
[data-ui-mode="mobile"] .seg button{padding:10px 4px;font-size:13.5px}
[data-ui-mode="mobile"] .check{padding:10px 0;font-size:13.5px}
[data-ui-mode="mobile"] .check input[type="checkbox"]{width:20px;height:20px}
[data-ui-mode="mobile"] .stop-row .stop-color{width:56px;height:38px}
[data-ui-mode="mobile"] .stop-row{gap:10px;margin-bottom:9px}

/* 底部面板（图层 / 属性） */
[data-ui-mode="mobile"] .right-panel{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  width:auto;border-left:none;border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
  height:var(--sheet-h);
  padding-bottom:var(--safe-b);
  box-shadow:0 -12px 40px rgba(0,0,0,.55);
  transition:transform .24s ease, height .2s ease;
  display:flex;
}
[data-ui-mode="mobile"][data-sheet="closed"] .right-panel{transform:translateY(102%)}
[data-ui-mode="mobile"][data-sheet="half"] .right-panel{transform:translateY(0);height:56vh}
[data-ui-mode="mobile"][data-sheet="full"] .right-panel{transform:translateY(0);height:92vh}
[data-ui-mode="mobile"] .sheet-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45;
}
[data-ui-mode="mobile"][data-sheet="full"] .sheet-backdrop{display:block}
[data-ui-mode="mobile"][data-sheet-tab="layers"] #paneProps{display:none}
[data-ui-mode="mobile"][data-sheet-tab="props"] #paneLayers{display:none}

[data-ui-mode="mobile"] .sheet-grabber{
  display:flex;align-items:center;justify-content:center;
  height:22px;flex:none;cursor:grab;touch-action:none;
}
[data-ui-mode="mobile"] .sheet-grabber span{
  width:44px;height:4px;border-radius:3px;background:#39405c;display:block;
}
[data-ui-mode="mobile"] .sheet-tabs{
  display:flex;align-items:center;gap:6px;flex:none;
  padding:0 10px 8px;border-bottom:1px solid var(--border);
}
[data-ui-mode="mobile"] .sheet-tab{
  flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
}
[data-ui-mode="mobile"] .sheet-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
[data-ui-mode="mobile"] .sheet-tab-btn{
  flex:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text);font-size:15px;cursor:pointer;
}
[data-ui-mode="mobile"] .layers-section,
[data-ui-mode="mobile"] .props-section{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
[data-ui-mode="mobile"] #layerList{max-height:none}
[data-ui-mode="mobile"] #layerList li{padding:10px 8px;border-radius:10px}
[data-ui-mode="mobile"] #layerList .thumb{width:46px;height:46px}
[data-ui-mode="mobile"] #layerList .lname{font-size:14px}
[data-ui-mode="mobile"] .icon-btn{width:34px;height:34px;font-size:16px}

/* 底部工具坞 */
[data-ui-mode="mobile"] .dock{
  flex:none;display:flex;align-items:stretch;gap:2px;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:4px calc(4px + var(--safe-r)) calc(4px + var(--safe-b)) calc(4px + var(--safe-l));
}
.dock-btn{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:6px 2px;border:none;border-radius:10px;background:transparent;color:var(--dim);
  font:inherit;font-size:10.5px;cursor:pointer;transition:background .15s,color .15s;
}
.dock-btn i{font-style:normal;font-size:17px;line-height:1.1}
.dock-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dock-btn:active{background:var(--bg4)}
.dock-btn.active{color:#fff;background:linear-gradient(135deg,rgba(91,124,250,.28),rgba(122,92,240,.28));box-shadow:inset 0 0 0 1px var(--accent)}

/* 移动端状态栏与 toast */
[data-ui-mode="mobile"] .statusbar{
  height:22px;padding:0 calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));
  font-size:10.5px;
}
[data-ui-mode="mobile"] #toast{bottom:calc(78px + var(--safe-b))}

/* 横屏手机：把底部面板压扁，工具坞图标与文字并排 */
@media (orientation:landscape) and (max-height:520px){
  [data-ui-mode="mobile"][data-sheet="half"] .right-panel{height:74vh}
  [data-ui-mode="mobile"] .dock{padding-top:2px;padding-bottom:2px}
  .dock-btn{flex-direction:row;gap:6px;font-size:12px}
  .dock-btn i{font-size:15px}
  [data-ui-mode="mobile"] .canvas-area{padding:8px}
}

/* 无 hover 设备上去掉 hover 白闪 */
@media (hover:none){
  .btn:hover{background:var(--bg3);border-color:var(--border)}
  .btn.primary:hover{filter:none}
  #layerList li:hover{background:transparent}
  .icon-btn:hover{background:transparent;color:var(--dim)}
}

</style>
</head>
<body>
  <div id="app">
    <header class="topbar">

'use strict';

/* ==================== 工具函数 ==================== */
const $ = (sel) => document.querySelector(sel);
const uid = () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const clampNum = (v, min, max) => { const n = +v; return isNaN(n) ? min : clamp(n, min, max); };

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function debounce(fn, ms) {
  let t = null;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function hexToRgb(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  if (isNaN(n) || h.length !== 6) return null;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  if (!a || !b) return c1;
  const mix = i => Math.round(a[i] + (b[i] - a[i]) * t).toString(16).padStart(2, '0');
  return '#' + mix(0) + mix(1) + mix(2);
}

/* 在两个相距最远的色标之间插入新色标（颜色取两端插值） */
function addGradientStop(stops) {
  const sorted = [...stops].sort((a, b) => a.pos - b.pos);
  if (sorted.length < 2) { stops.push({ pos: 50, color: '#ffffff' }); return; }
  let bestIdx = 0, bestGap = 0;
  for (let i = 0; i < sorted.length - 1; i++) {
    const gap = sorted[i + 1].pos - sorted[i].pos;
    if (gap > bestGap) { bestGap = gap; bestIdx = i; }
  }
  const mid = Math.round((sorted[bestIdx].pos + sorted[bestIdx + 1].pos) / 2);
  stops.push({ pos: mid, color: lerpColor(sorted[bestIdx].color, sorted[bestIdx + 1].color, 0.5) });
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ==================== 常量 ==================== */
const BG_ID = '__bg__';

const CANVAS_PRESETS = [
  { label: '1:1 正方形 1080×1080', w: 1080, h: 1080 },

];

const FONTS = [
  { label: '微软雅黑', value: '"Microsoft YaHei", sans-serif' },
  { label: '黑体 (SimHei)', value: 'SimHei, sans-serif' },
  { label: '宋体 (SimSun)', value: 'SimSun, serif' },
  { label: '楷体 (KaiTi)', value: 'KaiTi, serif' },
  { label: '仿宋 (FangSong)', value: 'FangSong, serif' },
  { label: 'Arial', value: 'Arial, sans-serif' },
  { label: 'Helvetica', value: 'Helvetica, sans-serif' },

/* ==================== 状态 ==================== */
const state = {
  canvas: { w: 1080, h: 1080 },
  background: { type: 'solid', color: '#232539', angle: 135, stops: [{ pos: 0, color: '#667eea' }, { pos: 100, color: '#764ba2' }], image: null, fit: 'cover', blur: 0 },

/* ==================== 全局变量 ==================== */
let canvasEl, ctx, canvasArea, layerList, propsContent, propsTitle, statusbar,
    zoomRange, zoomLabel, canvasPreset, fileInput, bgFileInput,
    btnUndo, btnRedo, toolSelect, toolText, btnZoomFit, btnExportPng, btnExportJpg,
    btnAddText, btnAddImage, btnDup, btnDel, btnLayerUp, btnLayerDown,
    btnCustomSize, btnNew, btnCenterBoth, bgThumbEl = null;

const measureCtx = document.createElement('canvas').getContext('2d');
const imageCache = new Map();

let undoStack = [], redoStack = [];
let pendingSnapshot = null, undoArmed = false;
let drag = null, dragLayerId = null, prevDnDSnapshot = null;
let zoomMode = 'fit', zoomVal = 1;

window._fileCb = null;

/* ==================== UI 模式：自动识别 PC / 安卓触屏 ==================== */
const ui = {
  mode: 'desktop',
  forced: 'auto',      /* auto | desktop | mobile */
  touch: false,
  pointerFine: true,
  drawer: 'closed',
  sheet: 'closed',     /* closed | half | full */
  sheetTab: 'layers',
};

const QUERY_MODE = (() => {
  const m = /[?&]ui=(desktop|mobile)\b/.exec(location.search);
  return m ? m[1] : null;
})();

function isMobileUI() { return ui.mode === 'mobile'; }

function readStoredUIMode() {
  try {
    const v = localStorage.getItem('sig.uiMode');
    return (v === 'desktop' || v === 'mobile') ? v : 'auto';
  } catch (e) { return 'auto'; }
}

function storeUIMode(v) {
  try { localStorage.setItem('sig.uiMode', v); } catch (e) {}
}

function detectTouch() {
  return (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
}

function hasFinePointer() {
  try { return window.matchMedia ? matchMedia('(any-pointer: fine)').matches : true; }
  catch (e) { return true; }
}

/* 判定规则与 index.html 里的首屏脚本保持一致 */
function detectUIMode() {
  const ua = navigator.userAgent || '';
  const mobileUA = /Android|iPhone|iPod|Windows Phone|Mobile/i.test(ua);
  const touch = detectTouch();
  const w = window.innerWidth, h = window.innerHeight;

  if (ui.forced === 'desktop' || ui.forced === 'mobile') return ui.forced;
  if (mobileUA) return 'mobile';
  if (touch && !hasFinePointer() && Math.min(w, h) <= 900) return 'mobile';
  if (w <= 720) return 'mobile';
  return 'desktop';
}

/* 画布自适应留白：移动端更紧凑 */
function viewPadding() { return isMobileUI() ? 26 : 60; }

function updateViewportHeight() {
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}

const SHORTCUTS_DESKTOP = [
  ['V', '选择 / 移动'],
  ['T', '文字工具（点画布添加）'],
  ['双击文字', '编辑内容'],
  ['Delete', '删除图层'],
  ['方向键', '微调位置（Shift 加速）'],
  ['Ctrl+Z / Y', '撤销 / 重做'],
  ['Ctrl+D', '复制图层'],
  ['拖入图片', '直接添加图层'],
];

const SHORTCUTS_MOBILE = [
  ['单指拖动', '移动图层 / 空白处平移画布'],
  ['双指捏合', '缩放画布'],
  ['双击图层', '编辑文字 / 替换图片'],
  ['点空白处', '取消选中'],
  ['底部工具坞', '选择 / 文字 / 加文字 / 加图片 / 图层 / 属性'],
];

function updateShortcutHelp() {
  const ul = document.getElementById('shortcutList');
  if (!ul) return;
  const list = isMobileUI() ? SHORTCUTS_MOBILE : SHORTCUTS_DESKTOP;
  ul.innerHTML = list
    .map(([k, v]) => `<li><b>${escapeHtml(k)}</b> ${escapeHtml(v)}</li>`)

function syncMobileUI() {
  const sel = document.getElementById('uiModeSel');
  if (sel) sel.value = ui.forced;
  const hint = document.getElementById('uiModeHint');
  if (hint) {
    const kind = ui.touch ? '触屏设备' : '非触屏设备';
    hint.textContent = ui.forced === 'auto'
      ? `当前自动判定为「${isMobileUI() ? '安卓 / 触屏版' : '电脑 / 桌面版'}」（${kind}，窗口 ${window.innerWidth}×${window.innerHeight}）`
      : `已手动锁定为「${ui.forced === 'mobile' ? '安卓 / 触屏版' : '电脑 / 桌面版'}」`;
  }
  const ms = document.getElementById('mToolSelect'), mt = document.getElementById('mToolText');
  if (ms) ms.classList.toggle('active', state.tool === 'select');
  if (mt) mt.classList.toggle('active', state.tool === 'text');
  updateUndoButtons();
}

function applyUIMode(mode, opts) {
  opts = opts || {};
  const changed = ui.mode !== mode;
  ui.mode = mode;
  ui.touch = detectTouch();
  ui.pointerFine = hasFinePointer();

  const root = document.documentElement;
  root.setAttribute('data-ui-mode', mode);
  root.setAttribute('data-touch', ui.touch ? '1' : '0');
  root.setAttribute('data-forced', ui.forced);

  if (mode !== 'mobile') { setDrawer('closed'); setSheet('closed'); }
  updateViewportHeight();
  updateShortcutHelp();
  syncMobileUI();
  if (changed) zoomMode = 'fit';
  applyZoom();
  if (opts.toast) toast(mode === 'mobile' ? '已切换到安卓 / 触屏版' : '已切换到电脑 / 桌面版');
}

function setForcedUIMode(v) {
  ui.forced = (v === 'desktop' || v === 'mobile') ? v : 'auto';
  storeUIMode(ui.forced);
  applyUIMode(detectUIMode(), { toast: true });
}

/* ==================== 抽屉 / 底部面板 ==================== */
function setDrawer(s) {
  ui.drawer = s;
  document.documentElement.setAttribute('data-drawer', s);
}

function setSheet(s, tab) {
  ui.sheet = s;
  if (tab) ui.sheetTab = tab;
  document.documentElement.setAttribute('data-sheet', s);
  document.documentElement.setAttribute('data-sheet-tab', ui.sheetTab);
  document.querySelectorAll('.sheet-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.sheetTab === ui.sheetTab));
}

/* ==================== 通用模态框（替代 prompt / confirm） ==================== */
let modalCloser = null;

function openModal(html, opts) {
  opts = opts || {};
  const mask = document.getElementById('modalMask');
  const box = document.getElementById('modalBox');
  box.innerHTML = html;
  mask.classList.add('show');

  const onMask = e => { if (e.target === mask && opts.dismissible !== false) close(null); };
  function close(result) {
    mask.classList.remove('show');
    box.innerHTML = '';
    mask.removeEventListener('click', onMask);
    modalCloser = null;
    if (opts.onClose) opts.onClose(result);
  }
  mask.addEventListener('click', onMask);
  modalCloser = close;
  if (opts.autofocus !== false) {
    const first = box.querySelector('input, select, textarea');
    if (first) setTimeout(() => { try { first.focus(); } catch (e) {} }, 80);
  }
  return { box, close };
}

function closeModal(v) { if (modalCloser) modalCloser(v); }

function uiConfirm(opts) {
  const o = typeof opts === 'string' ? { title: opts } : (opts || {});
  return new Promise(resolve => {
    const { box, close } = openModal(
      `<h3>${escapeHtml(o.title || '确认')}</h3>` +
      (o.body ? `<p class="hint">${escapeHtml(o.body)}</p>` : '') +
      `<div class="modal-actions">
         <button class="btn" data-act="cancel">${escapeHtml(o.cancelText || '取消')}</button>
         <button class="btn ${o.danger ? 'danger-ghost' : 'primary'}" data-act="ok">${escapeHtml(o.okText || '确定')}</button>
       </div>`,
      { onClose: v => resolve(v === true) });
    box.querySelector('[data-act="cancel"]').addEventListener('click', () => close(false));
    box.querySelector('[data-act="ok"]').addEventListener('click', () => close(true));
  });
}

function uiPromptSize(defW, defH) {
  return new Promise(resolve => {
    const { box, close } = openModal(
      `<h3>自定义画布尺寸</h3>
       <div class="prop-row">
         <div class="prop grow"><label>宽度（64–8000 px）</label><input type="number" id="m-size-w" min="64" max="8000" step="1" value="${defW}"></div>
         <div class="prop grow"><label>高度（64–8000 px）</label><input type="number" id="m-size-h" min="64" max="8000" step="1" value="${defH}"></div>
       </div>
       <p class="hint small">常用：1080×1080 正方形 · 1080×1920 手机竖屏 · 1920×1080 宽屏</p>
       <div class="modal-actions">
         <button class="btn" data-act="cancel">取消</button>
         <button class="btn primary" data-act="ok">应用</button>
       </div>`,
      { onClose: resolve });
    const wEl = box.querySelector('#m-size-w'), hEl = box.querySelector('#m-size-h');
    const submit = () => close({
      w: Math.round(clampNum(wEl.value, 64, 8000)),
      h: Math.round(clampNum(hEl.value, 64, 8000)),
    });
    box.querySelector('[data-act="cancel"]').addEventListener('click', () => close(null));
    box.querySelector('[data-act="ok"]').addEventListener('click', submit);
    [wEl, hEl].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
  });
}

/* 导出方式选择（移动端「导出」按钮） */
function openExportSheet() {
  const { box, close } = openModal(
    `<h3>导出 / 保存</h3>
     <p class="hint small">PNG 保留透明背景；JPG 体积更小。<br>
     <b>工程文件</b>保存的是可继续编辑的图层与文字，之后能再打开修改。</p>
     <div class="modal-actions" style="flex-direction:column">
       <button class="btn primary" data-act="project">💾 保存工程（可继续编辑）</button>
       <button class="btn" data-act="png">导出 PNG 图片</button>
       <button class="btn" data-act="jpg">导出 JPG 图片</button>
       <button class="btn" data-act="cancel" style="border-color:transparent;background:transparent;color:var(--dim)">取消</button>
     </div>`);
  box.querySelector('[data-act="project"]').addEventListener('click', () => { close(null); exportProject(); });
  box.querySelector('[data-act="png"]').addEventListener('click', () => { close(null); exportImage('png'); });
  box.querySelector('[data-act="jpg"]').addEventListener('click', () => { close(null); exportImage('jpg'); });
  box.querySelector('[data-act="cancel"]').addEventListener('click', () => close(null));
}

/* 导出结果面板：安卓 WebView 里 a[download] 不一定生效，提供长按保存兜底 */
function showExportModal(url, name, fmt) {
  const { box, close } = openModal(
    `<h3>导出完成（${fmt.toUpperCase()}）</h3>
     <img class="modal-preview" src="${url}" alt="导出预览">
     <p class="hint small">${isMobileUI()
        ? '若没有自动保存：长按上方图片选择「保存图片」，或点下面的按钮再试一次。'
        : '文件已开始下载。'}</p>
     <div class="modal-actions">
       <button class="btn" data-act="cancel">关闭</button>
       <button class="btn primary" data-act="save">保存 / 下载</button>
     </div>`,
    { autofocus: false, onClose: () => { setTimeout(() => URL.revokeObjectURL(url), 800); } });

  const save = () => {
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    try { a.click(); } catch (e) {}

    toast('已触发下载：' + name);
  };
  box.querySelector('[data-act="save"]').addEventListener('click', save);
  box.querySelector('[data-act="cancel"]').addEventListener('click', () => close(null));
}

/* ==================== 工程文件（raw / 可继续编辑） ====================
   导出 .sig.json：完整记录画布尺寸、背景、每个图层的文字与样式、
   图片原始 dataURL、选中项与视图缩放。载入后一切都能继续编辑，
   而不是一张已经定局的位图。
   ==================================================================== */
const PROJECT_FORMAT = 'small-image-generation-project';
const PROJECT_VERSION = 1;
const AUTOSAVE_KEY = 'sig.autosave.v1';
const AUTOSAVE_LIMIT = 3.5 * 1024 * 1024;   /* 字符数上限，避免撑爆 localStorage 配额 */

let currentProjectName = '';
let autosaveTimer = null;
let autosaveWarned = false;

const numOr = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
const strOr = (v, d) => (typeof v === 'string' && v) ? v : d;

function serializeLayer(l) {
  const base = {
    id: l.id, type: l.type, name: l.name,
    x: l.x, y: l.y,
    opacity: l.opacity, visible: l.visible,
    blur: l.blur || 0, offsetX: l.offsetX || 0, offsetY: l.offsetY || 0,
  };
  if (l.type === 'image') {
    return Object.assign(base, { src: l.src, w: l.w, h: l.h });
  }
  return Object.assign(base, {
    text: l.text,
    fontSize: l.fontSize, fontFamily: l.fontFamily,
    color: l.color, bold: !!l.bold, italic: !!l.italic, align: l.align,
    lineHeight: l.lineHeight,
    strokeColor: l.strokeColor, strokeWidth: l.strokeWidth,
    shadowOn: !!l.shadowOn, shadowBlur: l.shadowBlur, shadowColor: l.shadowColor,
    gradientOn: !!l.gradientOn, gradientAngle: l.gradientAngle,
    gradientStops: (l.gradientStops || []).map(s => ({ pos: s.pos, color: s.color })),
    autoCenter: !!l.autoCenter,
  });
}

function serializeProject() {
  return {
    format: PROJECT_FORMAT,
    version: PROJECT_VERSION,
    app: 'Small Image Generation',
    savedAt: new Date().toISOString(),
    canvas: { w: state.canvas.w, h: state.canvas.h },
    background: {
      type: state.background.type,
      color: state.background.color,
      angle: state.background.angle,
      stops: (state.background.stops || []).map(s => ({ pos: s.pos, color: s.color })),
      image: state.background.image,
      fit: state.background.fit,
      blur: state.background.blur || 0,
    },
    layers: state.layers.map(serializeLayer),
    selectedId: state.selectedId,
    view: { zoomMode: zoomMode, zoomVal: zoomVal },
  };
}

function deserializeLayer(raw, idx) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.type !== 'text' && raw.type !== 'image') return null;

  const common = {
    id: strOr(raw.id, uid()),
    type: raw.type,
    name: strOr(raw.name, (raw.type === 'text' ? '文字 ' : '图片 ') + (idx + 1)),
    x: numOr(raw.x, 0), y: numOr(raw.y, 0),
    opacity: clamp(numOr(raw.opacity, 1), 0, 1),
    visible: raw.visible !== false,
    blur: clamp(numOr(raw.blur, 0), 0, 100),
    offsetX: numOr(raw.offsetX, 0), offsetY: numOr(raw.offsetY, 0),
  };

  if (raw.type === 'image') {
    if (typeof raw.src !== 'string' || !raw.src) return null;
    return Object.assign(common, {
      src: raw.src,
      w: Math.max(1, numOr(raw.w, 300)),
      h: Math.max(1, numOr(raw.h, 300)),
    });
  }

  const stops = Array.isArray(raw.gradientStops) && raw.gradientStops.length >= 2
    ? raw.gradientStops.map(s => ({
        pos: clamp(numOr(s && s.pos, 0), 0, 100),
        color: strOr(s && s.color, '#ffffff'),
      }))
    : [{ pos: 0, color: '#ffd166' }, { pos: 100, color: '#ef476f' }];

  return Object.assign(common, {
    text: typeof raw.text === 'string' ? raw.text : '',
    fontSize: clamp(numOr(raw.fontSize, 48), 8, 800),
    fontFamily: strOr(raw.fontFamily, '"Microsoft YaHei", sans-serif'),
    color: strOr(raw.color, '#ffffff'),
    bold: !!raw.bold, italic: !!raw.italic,
    align: ['left', 'center', 'right'].indexOf(raw.align) >= 0 ? raw.align : 'center',
    lineHeight: clamp(numOr(raw.lineHeight, 1.2), 1, 2),
    strokeColor: strOr(raw.strokeColor, '#000000'),
    strokeWidth: clamp(numOr(raw.strokeWidth, 0), 0, 40),
    shadowOn: !!raw.shadowOn,
    shadowBlur: clamp(numOr(raw.shadowBlur, 8), 0, 60),
    shadowColor: strOr(raw.shadowColor, '#000000'),
    gradientOn: !!raw.gradientOn,
    gradientAngle: clamp(numOr(raw.gradientAngle, 0), 0, 359),
    gradientStops: stops,
    autoCenter: !!raw.autoCenter,
  });
}

function deserializeBackground(raw) {
  const def = {
    type: 'solid', color: '#232539', angle: 135,
    stops: [{ pos: 0, color: '#667eea' }, { pos: 100, color: '#764ba2' }],
    image: null, fit: 'cover', blur: 0,
  };
  if (!raw || typeof raw !== 'object') return def;
  const stops = Array.isArray(raw.stops) && raw.stops.length >= 2
    ? raw.stops.map(s => ({
        pos: clamp(numOr(s && s.pos, 0), 0, 100),
        color: strOr(s && s.color, '#ffffff'),
      }))
    : def.stops;
  return {
    type: ['solid', 'gradient', 'image', 'transparent'].indexOf(raw.type) >= 0 ? raw.type : 'solid',
    color: strOr(raw.color, def.color),
    angle: clamp(numOr(raw.angle, 135), 0, 359),
    stops: stops,
    image: typeof raw.image === 'string' ? raw.image : null,
    fit: raw.fit === 'stretch' ? 'stretch' : 'cover',
    blur: clamp(numOr(raw.blur, 0), 0, 100),
  };
}

function validateProject(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) {
    throw new Error('文件内容不是有效的工程数据');
  }
  if (data.format !== PROJECT_FORMAT) {
    throw new Error('这不是本应用导出的工程文件');
  }
  if (typeof data.version === 'number' && data.version > PROJECT_VERSION) {
    throw new Error('工程版本 v' + data.version + ' 过新，请更新应用');
  }
  return true;
}

function applyProject(data) {
  validateProject(data);

  const c = data.canvas || {};
  const w = clamp(Math.round(numOr(c.w, 1080)), 64, 8000);
  const h = clamp(Math.round(numOr(c.h, 1080)), 64, 8000);
  const layers = Array.isArray(data.layers)
    ? data.layers.map(deserializeLayer).filter(Boolean)
    : [];

  pushUndo();

  state.layers = layers;
  state.background = deserializeBackground(data.background);
  state.selectedId = null;

  /* 复用画布尺寸逻辑：设置尺寸 + 重新缩放 + 重绘 + 同步预设下拉 */
  applyCanvasSize(w, h, false);

  if (typeof data.selectedId === 'string' && layers.some(l => l.id === data.selectedId)) {
    select(data.selectedId);
  } else {
    renderLayers(); renderProps(); render();
  }

  const v = data.view || {};
  if (v.zoomMode === 'manual' && typeof v.zoomVal === 'number') {
    zoomMode = 'manual';
    zoomVal = clamp(v.zoomVal, 0.05, 4);
  } else {
    zoomMode = 'fit';
  }
  applyZoom();

  return { layers: layers.length, w: w, h: h };
}

function projectFileName() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const stamp = '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
  return 'project_' + state.canvas.w + 'x' + state.canvas.h + '_' + stamp + '.sig.json';
}

function setProjectInfo(text) {
  const el = document.getElementById('projectInfo');
  if (el) el.textContent = text;
}

function triggerDownload(url, name) {
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  try { a.click(); } catch (e) {}
  a.remove();
}

async function shareFile(blob, name) {
  try {
    if (typeof File === 'function' && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return true;
      }
    }
  } catch (e) { /* 用户取消或不支持 */ }
  return false;
}

function exportProject() {
  let json;
  try {
    json = JSON.stringify(serializeProject());
  } catch (e) {
    toast('工程序列化失败：' + e.message);
    return;
  }

  const name = projectFileName();
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const kb = (blob.size / 1024).toFixed(1);

  triggerDownload(url, name);
  currentProjectName = name;
  setProjectInfo('最近保存：' + name + '（' + kb + ' KB）· ' + state.layers.length + ' 个图层');
  toast('已导出工程 ' + name + '（' + kb + ' KB）');

  if (isMobileUI()) {
    const { box, close } = openModal(
      '<h3>工程已导出</h3>' +
      '<p class="hint">文件名：<b>' + escapeHtml(name) + '</b><br>大小：' + kb + ' KB · 图层 ' + state.layers.length + ' 个</p>' +
      '<p class="hint small">此文件保存的是可继续编辑的工程数据（图层 / 文字 / 图片 / 画布尺寸），不是图片。<br>' +
      '若浏览器没有自动保存，可点「下载」或「分享」保存到手机文件里。</p>' +
      '<div class="modal-actions">' +
        '<button class="btn" data-act="cancel">关闭</button>' +
        '<button class="btn" data-act="share">分享 / 另存</button>' +
        '<button class="btn primary" data-act="save">下载</button>' +
      '</div>',
      { autofocus: false, onClose: () => setTimeout(() => URL.revokeObjectURL(url), 800) });

    box.querySelector('[data-act="save"]').addEventListener('click', () => {
      triggerDownload(url, name);
      toast('已触发下载：' + name);
    });
    box.querySelector('[data-act="share"]').addEventListener('click', async () => {
      const done = await shareFile(blob, name);
      if (!done) toast('当前浏览器不支持分享，请用「下载」');
    });
    box.querySelector('[data-act="cancel"]').addEventListener('click', () => close(null));
  } else {
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
}

function loadProjectFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(String(reader.result));
    } catch (e) {
      toast('载入失败：文件不是有效的 JSON');
      return;
    }
    try {
      const r = applyProject(data);
      currentProjectName = file.name;
      setProjectInfo('已打开：' + file.name + ' · ' + r.w + '×' + r.h + ' · ' + r.layers + ' 个图层');
      toast('已载入工程：' + file.name);
    } catch (e) {
      toast('载入失败：' + e.message);
    }
  };
  reader.onerror = () => toast('文件读取失败');
  reader.readAsText(file);
}

function requestProjectFile() {
  const el = document.getElementById('projectFileInput');
  if (el) el.click();
}

/* ---------- 自动存档：防手滑丢失进度 ---------- */
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(doAutosave, 1500);
}

function doAutosave() {
  try {
    const json = JSON.stringify(serializeProject());
    if (json.length > AUTOSAVE_LIMIT) {
      if (!autosaveWarned) {
        autosaveWarned = true;
        setProjectInfo('工程较大（含图片），已停用自动存档，请手动「保存工程」。');
      }
      return;
    }
    localStorage.setItem(AUTOSAVE_KEY, json);
  } catch (e) { /* 配额不足等，静默忽略 */ }
}

function readAutosave() {
  try {
    const json = localStorage.getItem(AUTOSAVE_KEY);
    if (!json) return null;
    const data = JSON.parse(json);
    validateProject(data);
    return data;
  } catch (e) { return null; }
}

function clearAutosave() {
  try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
}

function maybeOfferAutosaveRestore() {
  const saved = readAutosave();
  if (!saved) return;
  const when = saved.savedAt ? new Date(saved.savedAt).toLocaleString() : '上次';
  const n = Array.isArray(saved.layers) ? saved.layers.length : 0;
  const c = saved.canvas || {};
  setTimeout(async () => {
    const ok = await uiConfirm({
      title: '恢复上次的编辑？',
      body: '检测到自动存档：' + when + '，画布 ' + (c.w || '?') + '×' + (c.h || '?') + '，' + n + ' 个图层。',
      okText: '恢复',
      cancelText: '不用了',
    });
    if (ok) {
      try {
        applyProject(saved);
        setProjectInfo('已从自动存档恢复（' + when + '）');
        toast('已恢复上次编辑');
      } catch (e) {
        toast('恢复失败：' + e.message);
      }
    } else {
      clearAutosave();
    }
  }, 420);
}

/* ==================== 画布与渲染 ==================== */
function fontString(layer) {
  return `${layer.italic ? 'italic ' : ''}${layer.bold ? 'bold ' : ''}${layer.fontSize}px ${layer.fontFamily}`;
}

/* 线性渐变（支持任意数量色标），坐标为绝对画布坐标 */
function makeLinearGradient(g, x, y, w, h, angle, stops) {
  const rad = angle * Math.PI / 180;
  const cx = x + w / 2, cy = y + h / 2;
  const half = Math.hypot(w, h) / 2;
  const gr = g.createLinearGradient(
    cx - Math.cos(rad) * half, cy - Math.sin(rad) * half,
    cx + Math.cos(rad) * half, cy + Math.sin(rad) * half);
  const sorted = [...stops].sort((a, b) => a.pos - b.pos);
  sorted.forEach(s => gr.addColorStop(clamp(s.pos, 0, 100) / 100, s.color));
  return gr;
}

function measureTextLayer(layer) {
  measureCtx.font = fontString(layer);
  const lines = layer.text.split('\n');
  let w = 0;
  for (const ln of lines) {
    const tw = measureCtx.measureText(ln).width;
    if (tw > w) w = tw;
  }
  const h = lines.length * layer.fontSize * layer.lineHeight;
  return { w, h, lines };
}

function getLayerBox(layer) {
  if (layer.type === 'image') return { x: layer.x, y: layer.y, w: layer.w, h: layer.h };
  const m = measureTextLayer(layer);
  const pad = (layer.strokeWidth || 0) / 2 + (layer.shadowOn ? layer.shadowBlur : 0) + 3;
  return { x: layer.x - pad, y: layer.y - pad, w: m.w + pad * 2, h: m.h + pad * 2 };
}

function getImage(src) {
  if (imageCache.has(src)) return imageCache.get(src);
  const im = new Image();
  im.onload = () => { render(); updateThumbsDebounced(); };
  im.src = src;
  imageCache.set(src, im);
  return im;
}

function drawCover(g, img, x, y, w, h) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  const s = Math.max(w / iw, h / ih);
  const dw = iw * s, dh = ih * s;
  g.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

function drawTextLayer(g, layer) {
  if (!layer.text) return;
  g.save();
  g.globalAlpha = layer.opacity;
  if (layer.blur > 0) g.filter = `blur(${layer.blur}px)`;
  g.font = fontString(layer);
  g.textBaseline = 'top';
  if (layer.shadowOn) {
    g.shadowColor = layer.shadowColor;
    g.shadowBlur = layer.shadowBlur;
    g.shadowOffsetX = 0;
    g.shadowOffsetY = Math.max(1, layer.shadowBlur * 0.35);
  }
  const m = measureTextLayer(layer);
  const lh = layer.fontSize * layer.lineHeight;
  let x0 = layer.x;
  if (layer.align === 'center') x0 += m.w / 2;
  else if (layer.align === 'right') x0 += m.w;
  g.textAlign = layer.align === 'center' ? 'center' : layer.align === 'right' ? 'right' : 'left';
  if (layer.strokeWidth > 0) {
    g.lineWidth = layer.strokeWidth;
    g.lineJoin = 'round';
    g.miterLimit = 2;
    g.strokeStyle = layer.strokeColor;
  }
  if (layer.gradientOn && layer.gradientStops && layer.gradientStops.length >= 2) {
    g.fillStyle = makeLinearGradient(g, layer.x, layer.y, m.w, m.h, layer.gradientAngle, layer.gradientStops);
  } else {
    g.fillStyle = layer.color;
  }
  m.lines.forEach((ln, i) => {
    const y = layer.y + i * lh;
    if (layer.strokeWidth > 0) g.strokeText(ln, x0, y);
    g.fillText(ln, x0, y);
  });
  g.restore();
}

function drawImageLayer(g, layer) {
  const img = getImage(layer.src);
  if (!img.complete || !img.naturalWidth) return;
  g.save();
  g.globalAlpha = layer.opacity;
  if (layer.blur > 0) g.filter = `blur(${layer.blur}px)`;
  g.drawImage(img, layer.x, layer.y, layer.w, layer.h);
  g.restore();
}

function drawBackground(g, w, h) {
  const bg = state.background;
  g.save();
  if (bg.type !== 'transparent' && bg.blur > 0) g.filter = `blur(${bg.blur}px)`;
  if (bg.type === 'solid') {
    g.fillStyle = bg.color;
    g.fillRect(0, 0, w, h);
  } else if (bg.type === 'gradient') {
    g.fillStyle = makeLinearGradient(g, 0, 0, w, h, bg.angle, bg.stops);
    g.fillRect(0, 0, w, h);
  } else if (bg.type === 'image' && bg.image) {
    const img = getImage(bg.image);
    if (img.complete && img.naturalWidth) {
      if (bg.fit === 'cover') drawCover(g, img, 0, 0, w, h);
      else g.drawImage(img, 0, 0, w, h);
    }
  }
  g.restore();
  /* transparent：什么都不画 */
}

function renderScene(g, w, h) {
  drawBackground(g, w, h);
  for (const l of state.layers) {
    if (!l.visible) continue;
    if (l.type === 'image') drawImageLayer(g, l);
    else drawTextLayer(g, l);
  }
}

function drawSelection(g) {
  const layer = selectedLayer();
  if (!layer || !layer.visible) return;
  const box = getLayerBox(layer);
  const rect = canvasEl.getBoundingClientRect();
  const s = rect.width / state.canvas.w || 1;
  g.save();
  g.strokeStyle = '#7d9bff';
  g.lineWidth = 1.5 / s;
  g.setLineDash([6 / s, 4 / s]);
  g.strokeRect(box.x, box.y, box.w, box.h);
  g.setLineDash([]);
  const hs = 12 / s;
  const corners = [[box.x, box.y], [box.x + box.w, box.y], [box.x, box.y + box.h], [box.x + box.w, box.y + box.h]];
  g.fillStyle = '#ffffff';
  for (const [cx, cy] of corners) {
    g.fillRect(cx - hs / 2, cy - hs / 2, hs, hs);
    g.strokeRect(cx - hs / 2, cy - hs / 2, hs, hs);
  }
  g.restore();
}

function render() {
  const c = canvasEl, g = ctx;
  g.clearRect(0, 0, c.width, c.height);
  renderScene(g, c.width, c.height);
  drawSelection(g);
  updateThumbsDebounced();
  updateStatus();
  scheduleAutosave();
}

function applyCanvasSize(w, h, record) {
  if (record) pushUndo();
  state.canvas.w = w; state.canvas.h = h;
  canvasEl.width = w; canvasEl.height = h;
  applyZoom();
  render();
  updatePresetSelect();
}

function computeFitZoom() {
  const pad = viewPadding();
  const aw = Math.max(40, canvasArea.clientWidth - pad);
  const ah = Math.max(40, canvasArea.clientHeight - pad);
  return clamp(Math.min(aw / state.canvas.w, ah / state.canvas.h), 0.05, 2);
}

function applyZoom() {
  const z = zoomMode === 'fit' ? computeFitZoom() : zoomVal;
  canvasEl.style.width = Math.max(1, Math.round(state.canvas.w * z)) + 'px';
  canvasEl.style.height = Math.max(1, Math.round(state.canvas.h * z)) + 'px';
  const label = zoomMode === 'fit' ? '适应' : Math.round(z * 100) + '%';
  zoomLabel.textContent = label;
  const mLabel = document.getElementById('mZoomLabel');
  if (mLabel) mLabel.textContent = label;
  if (zoomMode === 'manual') zoomRange.value = Math.round(zoomVal * 100);
  updateStatus();
}

/* 以某个屏幕坐标为锚点缩放（触摸捏合与缩放按钮共用） */
function zoomAt(newZoom, clientX, clientY) {
  newZoom = clamp(newZoom, 0.05, 4);
  const r = canvasEl.getBoundingClientRect();
  const areaRect = canvasArea.getBoundingClientRect();
  const rx = r.width ? (clientX - r.left) / r.width : 0.5;
  const ry = r.height ? (clientY - r.top) / r.height : 0.5;
  const prevLeft = r.left - areaRect.left + canvasArea.scrollLeft;
  const prevTop = r.top - areaRect.top + canvasArea.scrollTop;
  const prevW = r.width, prevH = r.height;

  zoomMode = 'manual';
  zoomVal = newZoom;
  applyZoom();

  const r2 = canvasEl.getBoundingClientRect();
  const nextLeft = r2.left - areaRect.left + canvasArea.scrollLeft;
  const nextTop = r2.top - areaRect.top + canvasArea.scrollTop;
  const focusX = prevLeft + rx * prevW;
  const focusY = prevTop + ry * prevH;
  canvasArea.scrollLeft += (nextLeft + rx * r2.width) - focusX;
  canvasArea.scrollTop += (nextTop + ry * r2.height) - focusY;
}

function stepZoom(factor) {
  const cur = zoomMode === 'fit' ? computeFitZoom() : zoomVal;
  const r = canvasEl.getBoundingClientRect();
  zoomAt(cur * factor, r.left + r.width / 2, r.top + r.height / 2);
}

function updateStatus() {
  const sel = selectedLayer();
  const z = zoomMode === 'fit' ? '适应' : Math.round(zoomVal * 100) + '%';
  statusbar.textContent =
    `画布 ${state.canvas.w}×${state.canvas.h} px · 图层 ${state.layers.length}（+背景） · ` +
    `选中 ${state.selectedId === BG_ID ? '背景' : sel ? sel.name : '无'} · 缩放 ${z}`;
}

/* ==================== 命中检测与坐标 ==================== */
function canvasPos(e) {
  const r = canvasEl.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * state.canvas.w / r.width,
    y: (e.clientY - r.top) * state.canvas.h / r.height,
  };
}

function hitTest(x, y) {
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const l = state.layers[i];
    if (!l.visible) continue;
    const b = getLayerBox(l);
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return l;
  }
  return null;
}

function getHandleAt(x, y) {
  const layer = selectedLayer();
  if (!layer || !layer.visible) return null;
  const box = getLayerBox(layer);
  const rect = canvasEl.getBoundingClientRect();
  const s = rect.width / state.canvas.w || 1;
  const tol = 10 / s;
  const corners = [['nw', box.x, box.y], ['ne', box.x + box.w, box.y], ['sw', box.x, box.y + box.h], ['se', box.x + box.w, box.y + box.h]];
  for (const [n, cx, cy] of corners) {
    if (Math.abs(x - cx) <= tol && Math.abs(y - cy) <= tol) return n;
  }
  return null;
}

/* ==================== 选中与图层操作 ==================== */
function selectedLayer() {
  return state.layers.find(l => l.id === state.selectedId) || null;
}

function select(id) {
  flushOp();
  state.selectedId = id;
  renderLayers();
  renderProps();
  render();
}

function addTextLayerAt(x, y) {
  const n = state.layers.filter(l => l.type === 'text').length + 1;
  const layer = {
    id: uid(), type: 'text', name: `文字 ${n}`,
    text: '双击编辑文字',
    x, y,
    fontSize: Math.max(36, Math.round(state.canvas.w / 15)),
    fontFamily: '"Microsoft YaHei", sans-serif',
    color: '#ffffff', bold: false, italic: false, align: 'center',
    lineHeight: 1.2, strokeColor: '#000000', strokeWidth: 0,
    shadowOn: false, shadowBlur: 8, shadowColor: '#000000',
    opacity: 1, visible: true,
    gradientOn: false, gradientAngle: 0,
    gradientStops: [{ pos: 0, color: '#ffd166' }, { pos: 100, color: '#ef476f' }],
    blur: 0, offsetX: 0, offsetY: 0, autoCenter: false,
  };
  state.layers.push(layer);
  select(layer.id);
  return layer;
}

function addImageLayer(src, cx, cy) {
  const img = new Image();
  img.onload = () => {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    let w = state.canvas.w * 0.6, h = w * ih / iw;
    if (h > state.canvas.h * 0.85) { h = state.canvas.h * 0.85; w = h * iw / ih; }
    const x = cx != null ? cx - w / 2 : (state.canvas.w - w) / 2;
    const y = cy != null ? cy - h / 2 : (state.canvas.h - h) / 2;
    const layer = {
      id: uid(), type: 'image',
      name: `图片 ${state.layers.filter(l => l.type === 'image').length + 1}`,
      src, x, y, w, h, opacity: 1, visible: true,
      blur: 0, offsetX: 0, offsetY: 0,
    };
    pushUndo();
    state.layers.push(layer);
    select(layer.id);
  };
  img.onerror = () => toast('图片读取失败，请换一个文件');
  img.src = src;
}

function deleteLayer(id) {
  const i = state.layers.findIndex(l => l.id === id);
  if (i < 0) return;
  pushUndo();
  state.layers.splice(i, 1);
  if (state.selectedId === id) state.selectedId = null;
  renderLayers(); renderProps(); render();
}

function deleteSelected() {
  if (state.selectedId === BG_ID) { toast('背景图层不能删除，可以改成「透明」'); return; }
  const l = selectedLayer();
  if (!l) { toast('请先选中一个图层'); return; }
  deleteLayer(l.id);
}

function duplicateSelected() {
  const src = selectedLayer();
  if (!src) { toast('请先选中一个图层'); return; }
  pushUndo();
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.name = src.name + ' 副本';
  copy.x += 30; copy.y += 30;
  state.layers.splice(state.layers.indexOf(src) + 1, 0, copy);
  select(copy.id);
}

function toggleVisible(id) {
  const l = state.layers.find(x => x.id === id);
  if (!l) return;
  pushUndo();
  l.visible = !l.visible;
  renderLayers(); render();
}

function moveLayer(dir) {
  const l = selectedLayer();
  if (!l) return;
  const i = state.layers.indexOf(l);
  const j = i + dir; /* dir=1 上移一层（z 更高），dir=-1 下移 */
  if (j < 0 || j >= state.layers.length) return;
  pushUndo();
  state.layers.splice(i, 1);
  state.layers.splice(j, 0, l);
  renderLayers(); render();
}

/* 居中到画布（保留 X/Y 偏移） */
function centerLayer(l) {
  const ox = l.offsetX || 0, oy = l.offsetY || 0;
  if (l.type === 'image') {
    l.x = (state.canvas.w - l.w) / 2 + ox;
    l.y = (state.canvas.h - l.h) / 2 + oy;
  } else {
    const m = measureTextLayer(l);
    l.x = (state.canvas.w - m.w) / 2 + ox;
    l.y = (state.canvas.h - m.h) / 2 + oy;
  }
}

/* 文字图层开启「实时居中」后，内容/字号变化时自动重新居中 */
function maybeAutoCenter(l) {
  if (l.type === 'text' && l.autoCenter) centerLayer(l);
}

function alignSelected(mode) {
  const l = selectedLayer();
  if (!l) { toast('请先在画布或图层面板选中一个图层'); return; }
  const b = l.type === 'image' ? { w: l.w, h: l.h } : measureTextLayer(l);
  const ox = l.offsetX || 0, oy = l.offsetY || 0;
  pushUndo();
  if (mode === 'left') l.x = 0;
  if (mode === 'hcenter') l.x = (state.canvas.w - b.w) / 2 + ox;
  if (mode === 'right') l.x = state.canvas.w - b.w;
  if (mode === 'top') l.y = 0;
  if (mode === 'vcenter') l.y = (state.canvas.h - b.h) / 2 + oy;
  if (mode === 'bottom') l.y = state.canvas.h - b.h;
  if (mode === 'both') {
    l.x = (state.canvas.w - b.w) / 2 + ox;
    l.y = (state.canvas.h - b.h) / 2 + oy;
  }
  if (l.type === 'text' && l.autoCenter && ['left', 'right', 'top', 'bottom'].includes(mode)) {
    l.autoCenter = false;
    renderProps();
  }
  render();
}

/* ==================== 撤销 / 重做 ==================== */
function snapshot() {
  return JSON.stringify({ canvas: state.canvas, background: state.background, layers: state.layers });
}

function beginOp() {
  if (pendingSnapshot == null) pendingSnapshot = snapshot();
}

function endOp() {
  if (pendingSnapshot == null) return;
  if (snapshot() !== pendingSnapshot) {
    undoStack.push(pendingSnapshot);
    if (undoStack.length > 60) undoStack.shift();
    redoStack = [];
    updateUndoButtons();
  }
  pendingSnapshot = null;
}

function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
  updateUndoButtons();
}

function flushOp() {
  if (undoArmed) { endOp(); undoArmed = false; }
}

function updateUndoButtons() {
  const canUndo = undoStack.length > 0, canRedo = redoStack.length > 0;
  btnUndo.disabled = !canUndo;
  btnRedo.disabled = !canRedo;
  const mu = document.getElementById('mUndo'), mr = document.getElementById('mRedo');
  if (mu) mu.disabled = !canUndo;
  if (mr) mr.disabled = !canRedo;
}

function restore(str) {
  const s = JSON.parse(str);
  state.canvas = s.canvas;
  state.background = s.background;
  state.layers = s.layers;
  if (state.selectedId !== BG_ID && !state.layers.some(l => l.id === state.selectedId)) state.selectedId = null;
  canvasEl.width = state.canvas.w; canvasEl.height = state.canvas.h;
  applyZoom();
  render(); renderLayers(); renderProps();
}

function undo() {
  if (!undoStack.length) return;
  flushOp();
  redoStack.push(snapshot());
  restore(undoStack.pop());
  updateUndoButtons();
}

function redo() {
  if (!redoStack.length) return;
  flushOp();
  undoStack.push(snapshot());
  restore(redoStack.pop());
  updateUndoButtons();
}

/* ==================== 图层列表 UI ==================== */
function renderLayers() {
  const sel = state.selectedId;
  layerList.innerHTML = '';
  /* 列表顶部 = 最上层图层（与渲染顺序反序展示） */
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const l = state.layers[i];
    const li = document.createElement('li');
    li.dataset.id = l.id;
    li.draggable = true;
    li.classList.toggle('active', l.id === sel);
    li.innerHTML =
      `<button type="button" class="icon-btn eye" title="显示/隐藏">${l.visible ? '👁' : '🚫'}</button>` +
      `<canvas class="thumb" width="80" height="80"></canvas>` +
      `<span class="lname">${escapeHtml(l.name)}</span>` +
      `<button type="button" class="icon-btn del" title="删除图层">✕</button>`;
    l._thumbEl = li.querySelector('.thumb');
    layerList.appendChild(li);
  }
  const bgLi = document.createElement('li');
  bgLi.dataset.id = BG_ID;
  bgLi.classList.toggle('active', sel === BG_ID);
  bgLi.innerHTML =
    `<button type="button" class="icon-btn eye" title="背景固定在底部">🔒</button>` +
    `<canvas class="thumb" width="80" height="80"></canvas>` +
    `<span class="lname">背景</span>` +
    `<span style="flex:none;color:var(--dim);font-size:11px">底部</span>`;
  bgThumbEl = bgLi.querySelector('.thumb');
  layerList.appendChild(bgLi);
  updateThumbsDebounced();
}

function drawThumb(c, layer) {
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  if (layer.type === 'image') {
    const img = getImage(layer.src);
    if (img.complete && img.naturalWidth) drawCover(g, img, 0, 0, c.width, c.height);
    else { g.fillStyle = '#2a2f3f'; g.fillRect(0, 0, c.width, c.height); }
  } else {
    const box = measureTextLayer(layer);
    if (!box.w || !box.h) return;
    const s = Math.min(c.width / box.w, c.height / box.h) * 0.9;
    g.save();
    g.translate((c.width - box.w * s) / 2, (c.height - box.h * s) / 2);
    g.scale(s, s);
    drawTextLayer(g, { ...layer, x: 0, y: 0, opacity: 1 });
    g.restore();
  }
}

function drawBgThumb(c) {
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  const bg = state.background;
  if (bg.type !== 'transparent' && bg.blur > 0) g.filter = `blur(${bg.blur}px)`;
  if (bg.type === 'solid') {
    g.fillStyle = bg.color; g.fillRect(0, 0, c.width, c.height);
  } else if (bg.type === 'gradient') {
    g.fillStyle = makeLinearGradient(g, 0, 0, c.width, c.height, bg.angle, bg.stops);
    g.fillRect(0, 0, c.width, c.height);
  } else if (bg.type === 'image' && bg.image) {
    const img = getImage(bg.image);
    if (img.complete && img.naturalWidth) drawCover(g, img, 0, 0, c.width, c.height);
  }
}

const updateThumbsDebounced = debounce(updateThumbs, 150);
function updateThumbs() {
  for (const l of state.layers) {
    if (l._thumbEl && l._thumbEl.isConnected) drawThumb(l._thumbEl, l);
  }
  if (bgThumbEl && bgThumbEl.isConnected) drawBgThumb(bgThumbEl);
}

function syncLayersFromDom() {
  const ids = [...layerList.querySelectorAll('li[data-id]')].map(li => li.dataset.id).filter(id => id !== BG_ID);
  const byId = new Map(state.layers.map(l => [l.id, l]));
  /* DOM 顺序是顶层在前，数组顺序是底层在前，需要反转 */
  const next = ids.reverse().map(id => byId.get(id)).filter(Boolean);
  if (next.length === state.layers.length) state.layers = next;
  render();
}

/* ==================== 属性面板 ==================== */
function armInput(el, fn) {
  const evt = (el.type === 'checkbox' || el.tagName === 'SELECT') ? 'change' : 'input';
  el.addEventListener('focus', () => { if (!undoArmed) { beginOp(); undoArmed = true; } });
  el.addEventListener('blur', () => { if (undoArmed) { endOp(); undoArmed = false; } });
  el.addEventListener(evt, () => fn(el.type === 'checkbox' ? el.checked : el.value));
}

function updateTag(id, v) {
  const el = propsContent.querySelector('#' + id);
  if (el) el.textContent = v;
}

/* 渲染渐变色标列表：每行 = 颜色 + 位置滑杆 */
function renderStops(container, stops, onChange) {
  container.innerHTML = '';
  const sorted = [...stops].sort((a, b) => a.pos - b.pos);
  sorted.forEach(s => {
    const row = document.createElement('div');
    row.className = 'stop-row';
    row.innerHTML =
      `<input type="color" class="stop-color" value="${escapeHtml(s.color)}">` +
      `<input type="range" class="stop-pos" min="0" max="100" step="1" value="${s.pos}">` +
      `<span class="stop-pos-label">${s.pos}%</span>`;
    const cEl = row.querySelector('.stop-color');
    const pEl = row.querySelector('.stop-pos');
    const lbl = row.querySelector('.stop-pos-label');
    armInput(cEl, v => { s.color = v; onChange(); });
    armInput(pEl, v => { s.pos = clampNum(v, 0, 100); lbl.textContent = s.pos + '%'; onChange(); });
    container.appendChild(row);
  });
}

function bindTextProps(layer) {
  const pc = propsContent;
  const $id = id => pc.querySelector(id);
  const ta = $id('#p-text'); ta.value = layer.text;
  armInput(ta, v => { layer.text = v; maybeAutoCenter(layer); render(); });

  const fontSel = $id('#p-font'); fontSel.value = layer.fontFamily;
  armInput(fontSel, v => { layer.fontFamily = v; maybeAutoCenter(layer); render(); });

  const size = $id('#p-size'); size.value = layer.fontSize;
  updateTag('p-size-tag', Math.round(layer.fontSize) + 'px');
  armInput(size, v => { layer.fontSize = clampNum(v, 8, 400); updateTag('p-size-tag', Math.round(layer.fontSize) + 'px'); maybeAutoCenter(layer); render(); });

  const color = $id('#p-color'); color.value = layer.color;
  armInput(color, v => { layer.color = v; render(); });

  const sc = $id('#p-strokeColor'); sc.value = layer.strokeColor;
  armInput(sc, v => { layer.strokeColor = v; render(); });

  const sw = $id('#p-strokeWidth'); sw.value = layer.strokeWidth;
  armInput(sw, v => { layer.strokeWidth = clampNum(v, 0, 40); render(); });

  const so = $id('#p-shadowOn'); so.checked = layer.shadowOn;
  so.addEventListener('change', () => { pushUndo(); layer.shadowOn = so.checked; render(); });

  const sbc = $id('#p-shadowColor'); sbc.value = layer.shadowColor;
  armInput(sbc, v => { layer.shadowColor = v; render(); });

  const sb = $id('#p-shadowBlur'); sb.value = layer.shadowBlur;
  updateTag('p-shadowBlur-tag', layer.shadowBlur + 'px');
  armInput(sb, v => { layer.shadowBlur = clampNum(v, 0, 60); updateTag('p-shadowBlur-tag', layer.shadowBlur + 'px'); render(); });

  const lh = $id('#p-lineHeight'); lh.value = layer.lineHeight;
  updateTag('p-lineHeight-tag', (+layer.lineHeight).toFixed(2));
  armInput(lh, v => { layer.lineHeight = clampNum(v, 1, 2); updateTag('p-lineHeight-tag', (+layer.lineHeight).toFixed(2)); maybeAutoCenter(layer); render(); });

  const op = $id('#p-opacity'); op.value = Math.round(layer.opacity * 100);
  updateTag('p-opacity-tag', Math.round(layer.opacity * 100) + '%');
  armInput(op, v => { layer.opacity = clampNum(v, 0, 100) / 100; updateTag('p-opacity-tag', Math.round(layer.opacity * 100) + '%'); render(); });

  /* 定位：居中 / 实时居中 / XY 偏移 */
  const ac = $id('#p-autoCenter'); ac.checked = !!layer.autoCenter;
  ac.addEventListener('change', () => {
    pushUndo();
    layer.autoCenter = ac.checked;
    if (layer.autoCenter) centerLayer(layer);
    render();
  });
  $id('#p-center').addEventListener('click', () => { pushUndo(); centerLayer(layer); render(); });

  const ox = $id('#p-offsetX'); ox.value = layer.offsetX || 0;
  armInput(ox, v => {
    const nv = clampNum(v, -100000, 100000);
    layer.x += nv - (layer.offsetX || 0);
    layer.offsetX = nv;
    render();
  });
