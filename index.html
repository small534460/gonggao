<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图层画布编辑器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">🎨 图层画布编辑器</div>
      <div class="topbar-group">
        <button id="btnUndo" class="btn" title="撤销 (Ctrl+Z)">↩ 撤销</button>
        <button id="btnRedo" class="btn" title="重做 (Ctrl+Y)">↪ 重做</button>
      </div>
      <div class="topbar-group">
        <span class="dim-label">缩放</span>
        <button id="btnZoomFit" class="btn" title="缩放以适合窗口">适应</button>
        <input type="range" id="zoomRange" min="10" max="200" step="5" value="100">
        <span id="zoomLabel" class="dim-label">100%</span>
      </div>
      <div class="spacer"></div>
      <div class="topbar-group">
        <button id="btnExportPng" class="btn primary" title="导出为 PNG 图片（保留透明）">⬇ 导出 PNG</button>
        <button id="btnExportJpg" class="btn" title="导出为 JPG 图片">⬇ 导出 JPG</button>
      </div>
    </header>

    <div class="main">
      <!-- 左侧：工具 -->
      <aside class="left-panel">
        <section class="panel-section">
          <h3>工具</h3>
          <div class="tool-row">
            <button id="toolSelect" class="btn tool-btn active" title="快捷键 V">🖱 选择 / 移动</button>
            <button id="toolText" class="btn tool-btn" title="快捷键 T">T 文字</button>
          </div>
        </section>

        <section class="panel-section">
          <h3>画布尺寸</h3>
          <select id="canvasPreset"></select>
          <button id="btnCustomSize" class="btn block">自定义尺寸…</button>
        </section>

        <section class="panel-section">
          <h3>对齐画布（选中图层）</h3>
          <div class="align-grid">
            <button class="btn align-btn" data-align="left" title="左对齐">⬅</button>
            <button class="btn align-btn" data-align="hcenter" title="水平居中">↔</button>
            <button class="btn align-btn" data-align="right" title="右对齐">➡</button>
            <button class="btn align-btn" data-align="top" title="顶部对齐">⬆</button>
            <button class="btn align-btn" data-align="vcenter" title="垂直居中">↕</button>
            <button class="btn align-btn" data-align="bottom" title="底部对齐">⬇</button>
          </div>
          <button id="btnCenterBoth" class="btn block">水平 + 垂直居中</button>
        </section>

        <section class="panel-section">
          <h3>项目</h3>
          <button id="btnNew" class="btn block danger-ghost">🗑 新建 / 清空全部</button>
        </section>

        <section class="panel-section">
          <h3>快捷键</h3>
          <ul class="shortcuts">
            <li><b>V</b> 选择 / 移动</li>
            <li><b>T</b> 文字工具（点画布添加）</li>
            <li><b>双击文字</b> 编辑内容</li>
            <li><b>Delete</b> 删除图层</li>
            <li><b>方向键</b> 微调位置（Shift 加速）</li>
            <li><b>Ctrl+Z / Y</b> 撤销 / 重做</li>
            <li><b>Ctrl+D</b> 复制图层</li>
            <li><b>拖入图片</b> 直接添加图层</li>
          </ul>
        </section>
      </aside>

      <!-- 中间：画布 -->
      <main class="canvas-area" id="canvasArea">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas"></canvas>
        </div>
      </main>

      <!-- 右侧：图层 + 属性 -->
      <aside class="right-panel">
        <section class="panel-section layers-section">
          <div class="panel-header">
            <h3>图层</h3>
            <div class="mini-btns">
              <button id="btnAddText" class="btn mini" title="添加文字图层">+ 文字</button>
              <button id="btnAddImage" class="btn mini" title="添加图片图层">+ 图片</button>
            </div>
          </div>
          <div class="panel-header second">
            <div class="mini-btns">
              <button id="btnDup" class="btn mini" title="复制选中图层 (Ctrl+D)">复制</button>
              <button id="btnDel" class="btn mini" title="删除选中图层 (Delete)">删除</button>
              <button id="btnLayerUp" class="btn mini" title="上移一层">▲</button>
              <button id="btnLayerDown" class="btn mini" title="下移一层">▼</button>
            </div>
          </div>
          <ul id="layerList"></ul>
        </section>
        <section class="panel-section props-section">
          <h3 id="propsTitle">属性</h3>
          <div id="propsContent"></div>
        </section>
      </aside>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
  </div>

  <div id="toast"></div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="bgFileInput" accept="image/*" hidden>
  <script src="app.js"></script>
</body>
</html>
