    :root{

    html, body { height: 100%; }

    /* 背景使用图片 + 渐变��加，替换下面的 URL 即可更换背景图 */

      margin: 0;

        url('https://free.boltp.com/2026/01/17/696b9e7124a9e.webp') center/cover no-repeat fixed;
      color: #e6eef8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .wrap{
      width: 100%;
      max-width: 880px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    header{
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .logo{
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      box-shadow: 0 6px 18px rgba(96,165,250,0.12);
      flex: 0 0 64px;
    }

    h1{
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.6px;
    }

    .subtitle{
      margin: 6px 0 0 0;

    .intro{
      background: var(--glass);

    .links{
      list-style: none;
      padding: 0;

      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

    .links a{

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01));
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.02);
      transition: transform .16s ease, box-shadow .16s ease;
      display: flex;

    .card:hover{
      transform: translateY(-6px);
      box-shadow: 0 14px 40px rgba(2,6,23,0.6);
    }

    .card .title{
      font-weight: 600;

    .card .desc{

    footer{
      margin-top: 18px;

    .small{

    }

    @media (max-width:520px){
      .logo{width:52px;height:52px;font-size:18px;}
      .wrap{padding:18px;}

      <ul class="links" aria-label="公告">
        <li>
          <a class="card" href="https://small534460.github.io/" target="_blank" rel="noopener noreferrer">
            <div class="title">————好吧，什么也没有————</div>
            
<script>
// 平衡优化生物生态模拟
const canvas = document.getElementById('lifeCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 440;
const ENTITY_SIZE = 7;
const NUM_ANIMALS = 10;
const NUM_HUNTERS = 2;
const FOOD_MAX = 22;
const FOOD_REFRESH = 14;
const MOVE_SPEED = 1.8;         // 普通生物移动速度
const HUNTER_SPEED = 2.2;       // 猎人生物移动速度
const DAY_LENGTH = 300;         // “一天”步数拉长
const NORMAL_NEED = 1;          // 蓝生物一天消耗
const HUNTER_NEED = 2;          // 红生物一天消耗
const NORMAL_BORN = 5;          // 普通生物繁殖阈值
const HUNTER_BORN = 7;          // 猎人生物繁殖阈值
const BORN_ENERGY_COST = 2;     // 繁殖需耗能量
const ANIMAL_VIEW_DIST = 60;
const HUNTER_VIEW_DIST = 85;
const ESCAPE_FORCE = 3.2;
const HUNTER_ATTACK_DIST = ENTITY_SIZE * 1.7;
const BABY_GUARD_AGE = 1;       // 新生物一天内不被猎杀
const MAX_TOTAL = 60;           // 生物总数上限(极端增长时收敛保护)

function randomPos() {
  return Math.random() * (GRID_SIZE - 2*ENTITY_SIZE) + ENTITY_SIZE;
}

class Food {
  constructor(x, y) {
    this.x = x;
    this.y = y;
  }
}

class Animal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.energy = 2;
    this.type = "normal";
    this.alive = true;
    this.age = 0;
    this.childAge = 0; // >0:尚属新生
  }
  get need() { return NORMAL_NEED; }
  get born() { return NORMAL_BORN; }
  color() { return "#3b82f6"; }
  isChild() { return this.childAge > 0 && this.childAge <= BABY_GUARD_AGE; }
  act(hunters, foods) {
    if (!this.alive) return;
    let tx = 0, ty = 0;
    // 躲避最近猎人
    let escape = false;
    for (const h of hunters) {
      const d = Math.hypot(h.x - this.x, h.y - this.y);
      if (d < ANIMAL_VIEW_DIST) {
        tx -= (h.x - this.x);
        ty -= (h.y - this.y);
        escape = true;
      }
    }
    // 若逃离猎人，否则追食物
    if (!escape) {
      let best = null, bd = 99999;
      for (const f of foods) {
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < bd) { bd = d; best = f; }
      }
      if (best) { tx += (best.x - this.x); ty += (best.y - this.y);}
    } else {
      tx *= ESCAPE_FORCE; ty *= ESCAPE_FORCE;
    }
    // 移动
    const norm = Math.max(1, Math.hypot(tx, ty));
    this.x += MOVE_SPEED * tx / norm;
    this.y += MOVE_SPEED * ty / norm;
    this.x = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.x));
    this.y = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.y));
  }
}

class Hunter {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.energy = 3;
    this.type = "hunter";
    this.alive = true;
    this.age = 0;
    this.childAge = 0;
  }
  get need() { return HUNTER_NEED; }
  get born() { return HUNTER_BORN; }
  color() { return "#ef4444"; }
  isChild() { return this.childAge > 0 && this.childAge <= BABY_GUARD_AGE; }
  act(animals, foods) {
    if (!this.alive) return;
    // 优先猎捕最近非宝宝蓝生物
    let best = null, bd = 99999;
    for (const a of animals) {
      if (a.alive && !a.isChild()) {
        const d = Math.hypot(a.x - this.x, a.y - this.y);
        if (d < bd && d < HUNTER_VIEW_DIST) { bd = d; best = a; }
      }
    }
    if (best) {
      const dx = best.x - this.x, dy = best.y - this.y, norm = Math.max(1, Math.hypot(dx, dy));
      this.x += HUNTER_SPEED * dx / norm;
      this.y += HUNTER_SPEED * dy / norm;
    } else {
      // 追食物
      let fbest = null, fd = 99999;
      for (const f of foods) {
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < fd) { fd = d; fbest = f;}
      }
      if (fbest) {
        const dx = fbest.x - this.x, dy = fbest.y - this.y, norm = Math.max(1, Math.hypot(dx, dy));
        this.x += HUNTER_SPEED * dx / norm;
        this.y += HUNTER_SPEED * dy / norm;
      }
    }
    this.x = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.x));
    this.y = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.y));
  }
}

let foods=[], animals=[], hunters=[];
let dayStep=0, ticks=0, totalBorn = 0;
function replenishFood() {
  // 只补至FOOD_REFRESH数量，位置均匀
  while (foods.length < FOOD_REFRESH)
    foods.push(new Food(randomPos(), randomPos()));
}

function init() {
  foods = [];
  animals = [];
  hunters = [];
  dayStep=0; totalBorn=0;
  for(let i=0;i<NUM_ANIMALS;i++) animals.push(new Animal(randomPos(), randomPos()));
  for(let i=0;i<NUM_HUNTERS;i++) hunters.push(new Hunter(randomPos(), randomPos()));
  replenishFood();
}
init();

function update() {
  ticks++;
  dayStep++;
  // 行动
  for(const a of animals) a.act(hunters, foods);
  for(const h of hunters) h.act(animals, foods);

  // 吃食物
  for(const a of animals) {
    if (!a.alive) continue;
    for (const f of foods) {
      if (Math.hypot(a.x - f.x, a.y - f.y) < ENTITY_SIZE*1.4) {
        foods = foods.filter(food => food !== f);
        a.energy++; break;
      }
    }
  }
  // 猎人吃蓝生物或食物
  for(const h of hunters) {
    if (!h.alive) continue;
    let huntdone = false;
    for (const a of animals) {
      if(a.alive && !a.isChild() && Math.hypot(h.x - a.x, h.y - a.y) < HUNTER_ATTACK_DIST){
        a.alive = false; h.energy += 3; huntdone=true; break;
      }
    }
    if (!huntdone) {
      for (const f of foods) {
        if (Math.hypot(h.x - f.x, h.y - f.y) < ENTITY_SIZE*1.3) {
          foods = foods.filter(food => food !== f);
          h.energy+=1; break;
        }
      }
    }
  }

  // 一天结算
  if (dayStep >= DAY_LENGTH) {
    let newbornAnimals=[], newbornHunters=[];
    // 蓝生物死亡/繁殖判定
    for (const a of animals) {
      a.age++;
      if (!a.alive) continue;
      a.energy -= a.need;
      if (a.energy < 0) a.alive = false;
      if (a.energy >= a.born && newbornAnimals.length < 3 && (animals.length+hunters.length)<MAX_TOTAL) {
        a.energy -= BORN_ENERGY_COST;
        let baby = new Animal(a.x, a.y); baby.childAge = 1; newbornAnimals.push(baby);
      }
      if (a.isChild()) a.childAge++; // 宝宝长大
    }
    // 猎人生物死亡/繁殖判定
    for (const h of hunters) {
      h.age++;
      if (!h.alive) continue;
      h.energy -= h.need;
      if (h.energy < 0) h.alive = false;
      if (h.energy >= h.born && newbornHunters.length < 1 && (animals.length+hunters.length)<MAX_TOTAL) {
        h.energy -= BORN_ENERGY_COST + 1;
        let baby = new Hunter(h.x, h.y); baby.childAge = 1; newbornHunters.push(baby);
      }
      if (h.isChild()) h.childAge++;
    }
    animals = animals.filter(a=>a.alive);
    hunters = hunters.filter(h=>h.alive);
    animals = animals.concat(newbornAnimals);
    hunters = hunters.concat(newbornHunters);
    replenishFood();
    dayStep = 0;
  }
  // 有生物数量食物太多则收敛
  if(foods.length>FOOD_MAX) foods=foods.slice(0,FOOD_MAX);

  animals = animals.filter(a=>a.alive);
  hunters = hunters.filter(h=>h.alive);
}

function render() {
  ctx.clearRect(0,0,GRID_SIZE,GRID_SIZE);
  // 食物
  for(const f of foods){
    ctx.beginPath();
    ctx.arc(f.x, f.y, ENTITY_SIZE-2, 0, Math.PI*2);
    ctx.fillStyle="#34d399";
    ctx.fill();
    ctx.closePath();
  }
  // 普通生物
  for(const a of animals){
    ctx.save();
    ctx.globalAlpha=a.isChild()?0.45:1.0;
    ctx.beginPath();
    ctx.arc(a.x,a.y,ENTITY_SIZE,0,Math.PI*2);
    ctx.fillStyle=a.color();
    ctx.fill();
    ctx.closePath();
    ctx.restore();
  }
  // 红色猎人
  for(const h of hunters){
    ctx.save();
    ctx.globalAlpha=h.isChild()?0.45:1.0;
    ctx.beginPath();
    ctx.arc(h.x,h.y,ENTITY_SIZE,0,Math.PI*2);
    ctx.fillStyle=h.color();
    ctx.fill();
    ctx.closePath();
    ctx.restore();
  }
  // 计数
  ctx.font="bold 13px Arial";
  ctx.fillStyle="#facc15";
  ctx.fillText(`天数:${ticks ? Math.floor(ticks/DAY_LENGTH)+1 : 1}`,10,20);
  ctx.fillText(`蓝生物: ${animals.length}`,110,20);
  ctx.fillStyle="#ee4444";
  ctx.fillText(`红猎人: ${hunters.length}`,220,20);
  ctx.fillStyle="#14b8a6";
  ctx.fillText(`食物: ${foods.length}`,320,20);
  if (animals.length===0 && hunters.length===0){
    ctx.font = "18px Arial";
    ctx.fillStyle = "#ef4444";
    ctx.fillText("所有生物都灭绝了", 90, 220);
  }
}

function loop() {
  update();
  render();
  if(!(animals.length===0 && hunters.length===0)) requestAnimationFrame(loop);
}
loop();
</script>
          </a>
        </li>
      </ul>
