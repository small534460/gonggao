/* ==================== 文件读取 ==================== */
function readImageFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function requestImageFile(cb) {
  window._fileCb = cb;
  fileInput.click();
}

/* ==================== 导出 ==================== */
function exportImage(fmt) {
  const off = document.createElement('canvas');
  off.width = state.canvas.w; off.height = state.canvas.h;
  const g = off.getContext('2d');
  if (fmt === 'jpg' && state.background.type === 'transparent') {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, off.width, off.height);
  }
  renderScene(g, off.width, off.height);
  const done = blob => {
    if (!blob) { toast('导出失败'); return; }
    const name = `canvas_${state.canvas.w}x${state.canvas.h}_${Date.now()}.${fmt === 'jpg' ? 'jpg' : 'png'}`;
    const url = URL.createObjectURL(blob);

    /* 先尝试常规下载（桌面浏览器有效） */
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    try { a.click(); } catch (e) {}
    a.remove();

    if (isMobileUI()) {
      /* 安卓：a[download] 在部分 WebView 里无效，给预览 + 长按保存兜底 */
      showExportModal(url, name, fmt);
    } else {
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast(`已导出 ${fmt.toUpperCase()} 图片`);
    }
  };

  if (off.toBlob) off.toBlob(done, fmt === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
  else { /* 极老内核兜底 */
    try {
      const dataUrl = off.toDataURL(fmt === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
      const bin = atob(dataUrl.split(',')[1]);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      done(new Blob([arr], { type: fmt === 'jpg' ? 'image/jpeg' : 'image/png' }));
    } catch (e) { toast('导出失败：' + e.message); }
  }
}

/* ==================== 交互（画布鼠标） ==================== */
function updateCursor(e) {
  const r = canvasEl.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (!inside) return;
  if (state.tool === 'text') { canvasEl.style.cursor = 'crosshair'; return; }
  const p = canvasPos(e);
  const h = getHandleAt(p.x, p.y);
  if (h) { canvasEl.style.cursor = (h === 'nw' || h === 'se') ? 'nwse-resize' : 'nesw-resize'; return; }
  canvasEl.style.cursor = hitTest(p.x, p.y) ? 'move' : 'default';
}

/* 活动指针（鼠标 / 手指），用于区分单指拖动与双指捏合 */
const activePointers = new Map();
let panState = null;
let pinchState = null;
let lastTap = null;

function startPinch() {
  const pts = [...activePointers.values()];
  if (pts.length < 2) return;
  const [a, b] = pts;
  pinchState = {
    dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
    zoom: zoomMode === 'fit' ? computeFitZoom() : zoomVal,
    cx: (a.x + b.x) / 2,
    cy: (a.y + b.y) / 2,
  };
  /* 捏合开始：放弃单指拖拽，避免误移动图层 */
  if (drag && drag.mode !== 'pan') endOp();
  drag = null;
  panState = null;
}

function updatePinch() {
  const pts = [...activePointers.values()];
  if (pts.length < 2 || !pinchState) return;
  const [a, b] = pts;
  const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  const target = clamp(pinchState.zoom * (dist / pinchState.dist), 0.05, 4);
  zoomAt(target, cx, cy);
  /* 双指整体平移 */
  canvasArea.scrollLeft -= (cx - pinchState.cx);
  canvasArea.scrollTop -= (cy - pinchState.cy);
  pinchState.cx = cx;
  pinchState.cy = cy;
}

function beginSingleGesture(e) {
  const p = canvasPos(e);
  const isTouch = e.pointerType !== 'mouse';

  /* 文字工具：在点击处新建文字图层并立刻拖动 */
  if (state.tool === 'text') {
    pushUndo();
    const layer = addTextLayerAt(p.x, p.y);
    setTool('select');
    state.focusText = true;
    renderProps();
    if (isMobileUI()) setSheet('full', 'props');
    drag = { mode: 'move', id: layer.id, startMX: p.x, startMY: p.y, origX: layer.x, origY: layer.y, moved: false };
    canvasEl.style.cursor = 'move';
    return;
  }

  const h = getHandleAt(p.x, p.y);
  if (h) {
    const layer = selectedLayer();
    beginOp();
    const box = getLayerBox(layer);
    drag = {
      mode: 'resize', id: layer.id, handle: h,
      startMX: p.x, startMY: p.y,
      origX: layer.x, origY: layer.y, origW: layer.w, origH: layer.h, origFont: layer.fontSize,
      box,
      aspect: layer.w / layer.h,
      anchor: { x: h.includes('w') ? box.x + box.w : box.x, y: h.includes('n') ? box.y + box.h : box.y },
      d0: Math.hypot(p.x - (box.x + box.w / 2), p.y - (box.y + box.h / 2)),
      moved: false,
    };
    return;
  }

  const hit = hitTest(p.x, p.y);
  if (hit) {
    if (state.selectedId !== hit.id) select(hit.id);
    beginOp();
    drag = { mode: 'move', id: hit.id, startMX: p.x, startMY: p.y, origX: hit.x, origY: hit.y, moved: false };
    return;
  }

  /* 空白区域：触摸时单指平移画布；鼠标时点击即取消选中 */
  if (isTouch) {
    panState = { startX: e.clientX, startY: e.clientY, sl: canvasArea.scrollLeft, st: canvasArea.scrollTop, moved: false };
    drag = { mode: 'pan', id: null, moved: false };
  } else if (state.selectedId !== null) {
    select(null);
  }
}

/* 双击图层：文字进入编辑，图片进入替换 */
function openLayerQuickAction(layer) {
  select(layer.id);
  if (layer.type === 'text') {
    state.focusText = true;
    renderProps();
    if (isMobileUI()) setSheet('full', 'props');
  } else if (isTouchDevice()) {
    if (isMobileUI()) setSheet('half', 'props');
    requestImageFile(src => { pushUndo(); layer.src = src; render(); });
  } else {
    requestImageFile(src => { pushUndo(); layer.src = src; render(); });
  }
}

function isTouchDevice() { return detectTouch(); }

/* 触摸点按登记：同一位置短时间内连点两次 = 双击 */
function registerTap(e, layer) {
  const now = Date.now();
  const isDouble = lastTap && (now - lastTap.t < 340) &&
    Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 34;

  if (isDouble) {
    lastTap = null;
    if (layer) { openLayerQuickAction(layer); return true; }
    return false;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  return false;
}

function finishPointer(e, cancelled) {
  const rec = activePointers.get(e.pointerId);
  const ptype = rec ? rec.type : 'mouse';
  activePointers.delete(e.pointerId);
  try { canvasEl.releasePointerCapture(e.pointerId); } catch (err) {}

  /* 双指变单指：终止捏合，剩余手指不再误触发拖动 */
  if (activePointers.size >= 1) {
    if (pinchState) { pinchState = null; drag = null; panState = null; }
    return;
  }

  pinchState = null;

  if (drag) {
    const mode = drag.mode;
    const dragId = drag.id;
    const wasTap = !drag.moved;
    if (mode !== 'pan') {
      /* 手动拖动/缩放文字图层后，关闭「实时居中」 */
      const l = state.layers.find(x => x.id === drag.id);
      if (l && l.type === 'text' && l.autoCenter && drag.moved) {
        const moved = mode === 'move'
          ? (l.x !== drag.origX || l.y !== drag.origY)
          : (l.x !== drag.origX || l.y !== drag.origY || l.fontSize !== drag.origFont);
        if (moved) { l.autoCenter = false; renderProps(); }
      }
      endOp();
    }
    drag = null;
    canvasEl.style.cursor = state.tool === 'text' ? 'crosshair' : 'default';

    /* 触摸点按图层：参与双击判定（双击文字进入编辑 / 双击图片替换） */
    if (!cancelled && wasTap && mode === 'move' && ptype !== 'mouse' && dragId) {
      const layer = state.layers.find(l => l.id === dragId);
      if (layer) registerTap(e, layer);
    }
  }

  if (panState) {
    const wasTap = !panState.moved;
    panState = null;
    if (!cancelled && wasTap) {
      const p = canvasPos(e);
      const hit = hitTest(p.x, p.y);
      if (!registerTap(e, hit) && !hit && state.selectedId !== null) select(null);
    }
  }
}

function bindCanvasMouse() {
  canvasEl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { canvasEl.setPointerCapture(e.pointerId); } catch (err) {}

    activePointers.set(e.pointerId, {
      x: e.clientX, y: e.clientY,
      sx: e.clientX, sy: e.clientY,
      type: e.pointerType,
    });

    if (activePointers.size === 2) { startPinch(); return; }
    if (activePointers.size > 2) return;

    beginSingleGesture(e);
    e.preventDefault();
  });

  window.addEventListener('pointermove', e => {
    const rec = activePointers.get(e.pointerId);
    if (rec) { rec.x = e.clientX; rec.y = e.clientY; }

    if (activePointers.size >= 2) { updatePinch(); return; }

    if (panState && drag && drag.mode === 'pan') {
      const dx = e.clientX - panState.startX;
      const dy = e.clientY - panState.startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) panState.moved = true;
      canvasArea.scrollLeft = panState.sl - dx;
      canvasArea.scrollTop = panState.st - dy;
      drag.moved = panState.moved;
      return;
    }

    if (!drag) {
      if (e.pointerType === 'mouse') updateCursor(e);
      return;
    }

    const p = canvasPos(e);
    const layer = state.layers.find(l => l.id === drag.id);
    if (!layer) return;
    drag.moved = true;
    if (drag.mode === 'move') {
      layer.x = drag.origX + (p.x - drag.startMX);
      layer.y = drag.origY + (p.y - drag.startMY);
    } else if (layer.type === 'image') {
      const w = clamp(Math.abs(p.x - drag.anchor.x), 8, 32000);
      const h = w / drag.aspect;
      layer.w = w; layer.h = h;
      layer.x = p.x < drag.anchor.x ? drag.anchor.x - w : drag.anchor.x;
      layer.y = p.y < drag.anchor.y ? drag.anchor.y - h : drag.anchor.y;
    } else {
      const cx = drag.box.x + drag.box.w / 2, cy = drag.box.y + drag.box.h / 2;
      const d = Math.hypot(p.x - cx, p.y - cy);
      layer.fontSize = clamp(drag.origFont * (d / Math.max(drag.d0, 0.001)), 8, 800);
      const nb = getLayerBox(layer);
      layer.x = drag.handle.includes('w') ? drag.anchor.x - nb.w : drag.anchor.x;
      layer.y = drag.handle.includes('n') ? drag.anchor.y - nb.h : drag.anchor.y;
    }
    render();
  });

  window.addEventListener('pointerup', e => finishPointer(e, false));
  window.addEventListener('pointercancel', e => finishPointer(e, true));

  /* 鼠标双击（触屏由 registerTap 处理，避免双份触发） */
  canvasEl.addEventListener('dblclick', e => {
    if (isTouchDevice() && isMobileUI()) return;
    const p = canvasPos(e);
    const hit = hitTest(p.x, p.y);
    if (!hit) return;
    select(hit.id);
    if (hit.type === 'text') {
      state.focusText = true;
      renderProps();
    } else {
      requestImageFile(src => { pushUndo(); hit.src = src; render(); });
    }
  });

  /* 桌面：滚轮缩放（Ctrl / Cmd + 滚轮），普通滚轮保持滚动 */
  canvasArea.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const cur = zoomMode === 'fit' ? computeFitZoom() : zoomVal;
    zoomAt(cur * factor, e.clientX, e.clientY);
  }, { passive: false });

  canvasEl.addEventListener('contextmenu', e => e.preventDefault());
}

/* ==================== 拖放图片文件 ==================== */
function bindDragDrop() {
  canvasArea.addEventListener('dragover', e => {
    if (e.dataTransfer.types.includes('Files')) {
      e.preventDefault();
      canvasArea.classList.add('drop-hint');
    }
  });
  canvasArea.addEventListener('dragleave', e => {
    if (e.target === canvasArea) canvasArea.classList.remove('drop-hint');
  });
  canvasArea.addEventListener('drop', e => {
    e.preventDefault();
    canvasArea.classList.remove('drop-hint');
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
    if (!files.length) { toast('请拖入图片文件'); return; }
    const p = canvasPos(e);
    const cx = clamp(p.x, 0, state.canvas.w), cy = clamp(p.y, 0, state.canvas.h);
    files.forEach(f => readImageFile(f).then(src => addImageLayer(src, cx, cy)));
  });
}

/* ==================== 工具切换 ==================== */
function setTool(t) {
  state.tool = t;
  toolSelect.classList.toggle('active', t === 'select');
  toolText.classList.toggle('active', t === 'text');
  const ms = document.getElementById('mToolSelect'), mt = document.getElementById('mToolText');
  if (ms) ms.classList.toggle('active', t === 'select');
  if (mt) mt.classList.toggle('active', t === 'text');
  canvasEl.style.cursor = t === 'text' ? 'crosshair' : 'default';
}

/* ==================== 快捷键 ==================== */
function nudge(dx, dy, e) {
  const l = selectedLayer();
  if (!l) return;
  e.preventDefault();
  beginOp();
  const step = e.shiftKey ? 10 : 1;
  l.x += dx * step;
  l.y += dy * step;
  render();
  endOp();
}

function bindKeyboard() {
  window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select'].includes(tag)) return;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (mod && k === 'd') { e.preventDefault(); duplicateSelected(); return; }
    if (mod && k === 's') { e.preventDefault(); exportProject(); return; }
    if (mod && k === 'o') { e.preventDefault(); requestProjectFile(); return; }
    switch (e.key) {
      case 'Delete': case 'Backspace': e.preventDefault(); deleteSelected(); break;
      case 'Escape': select(null); break;
      case 'v': case 'V': setTool('select'); break;
      case 't': case 'T': setTool('text'); break;
      case 'ArrowLeft': nudge(-1, 0, e); break;
      case 'ArrowRight': nudge(1, 0, e); break;
      case 'ArrowUp': nudge(0, -1, e); break;
      case 'ArrowDown': nudge(0, 1, e); break;
    }
  });
}
/* ==================== 初始化 ==================== */
function buildPresetSelect() {
  canvasPreset.innerHTML = CANVAS_PRESETS.map(p => `<option value="${p.w}x${p.h}">${p.label}</option>`).join('');
  canvasPreset.addEventListener('change', () => {
    const v = canvasPreset.value;
    if (v === 'custom') return;
    const [w, h] = v.split('x').map(Number);
    applyCanvasSize(w, h, true);
  });
}

function updatePresetSelect() {
  const found = CANVAS_PRESETS.find(p => p.w === state.canvas.w && p.h === state.canvas.h);
  if (found) { canvasPreset.value = `${found.w}x${found.h}`; return; }
  let opt = canvasPreset.querySelector('option[value="custom"]');
  if (!opt) { opt = document.createElement('option'); opt.value = 'custom'; canvasPreset.appendChild(opt); }
  opt.textContent = `${state.canvas.w}×${state.canvas.h}（自定义）`;
  canvasPreset.value = 'custom';
}

function bindAll() {
  btnUndo.addEventListener('click', undo);
  btnRedo.addEventListener('click', redo);
  toolSelect.addEventListener('click', () => setTool('select'));
  toolText.addEventListener('click', () => setTool('text'));

  btnZoomFit.addEventListener('click', () => { zoomMode = 'fit'; applyZoom(); });
  zoomRange.addEventListener('input', () => { zoomMode = 'manual'; zoomVal = +zoomRange.value / 100; applyZoom(); });

  btnExportPng.addEventListener('click', () => exportImage('png'));
  btnExportJpg.addEventListener('click', () => exportImage('jpg'));

  btnAddText.addEventListener('click', () => {
    pushUndo();
    const l = addTextLayerAt(state.canvas.w * 0.1, state.canvas.h * 0.4);
    l.autoCenter = true;
    centerLayer(l);
    state.focusText = true;
    renderProps();
    render();
  });

  btnAddImage.addEventListener('click', () => requestImageFile(src => addImageLayer(src)));
  btnDup.addEventListener('click', duplicateSelected);
  btnDel.addEventListener('click', deleteSelected);
  btnLayerUp.addEventListener('click', () => moveLayer(1));
  btnLayerDown.addEventListener('click', () => moveLayer(-1));

  btnCustomSize.addEventListener('click', async () => {
    const size = await uiPromptSize(state.canvas.w, state.canvas.h);
    if (!size) return;
    applyCanvasSize(size.w, size.h, true);
    toast(`画布已设为 ${size.w}×${size.h}`);
  });

  btnNew.addEventListener('click', async () => {
    const ok = await uiConfirm({
      title: '新建 / 清空全部',
      body: '确定清空全部图层并恢复默认设置吗？此操作可用「撤销」恢复。',
      okText: '清空',
      danger: true,
    });
    if (!ok) return;
    pushUndo();
    state.layers = [];
    state.selectedId = null;
    state.background = { type: 'solid', color: '#232539', angle: 135, stops: [{ pos: 0, color: '#667eea' }, { pos: 100, color: '#764ba2' }], image: null, fit: 'cover', blur: 0 };
    applyCanvasSize(1080, 1080, false);
    renderLayers(); renderProps(); render();
    toast('已清空');
  });

  /* 工程文件：保存 / 打开 */
  const btnSaveProject = $('#btnSaveProject');
  const btnSaveProjectTop = $('#btnSaveProjectTop');
  const btnOpenProject = $('#btnOpenProject');
  const projectFileInput = $('#projectFileInput');
  if (btnSaveProject) btnSaveProject.addEventListener('click', exportProject);
  if (btnSaveProjectTop) btnSaveProjectTop.addEventListener('click', exportProject);
  if (btnOpenProject) btnOpenProject.addEventListener('click', requestProjectFile);
  if (projectFileInput) projectFileInput.addEventListener('change', () => {
    const f = projectFileInput.files[0];
    projectFileInput.value = '';
    if (f) loadProjectFile(f);
  });

  /* 抽屉里的「缩放到」快捷按钮 */
  document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.zoom;
    if (v === 'fit') { zoomMode = 'fit'; applyZoom(); }
    else { zoomMode = 'manual'; zoomVal = +v; applyZoom(); }
    if (isMobileUI()) setDrawer('closed');
  }));

  document.querySelectorAll('.align-btn').forEach(b =>
    b.addEventListener('click', () => alignSelected(b.dataset.align)));
  btnCenterBoth.addEventListener('click', () => alignSelected('both'));

  /* 图层列表：点击 / 拖拽排序 */
  layerList.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = li.dataset.id;
    if (e.target.classList.contains('eye')) { if (id !== BG_ID) toggleVisible(id); return; }
    if (e.target.classList.contains('del')) {
      if (id === BG_ID) toast('背景图层不能删除');
      else deleteLayer(id);
      return;
    }
    if (isMobileUI() && id === state.selectedId) {
      /* 移动端：再次点击已选中的图层 → 直接打开属性面板 */
      setSheet('half', 'props');
      return;
    }
    select(id);
  });

  layerList.addEventListener('dragstart', e => {
    const li = e.target.closest('li');
    if (!li || li.dataset.id === BG_ID) { e.preventDefault(); return; }
    dragLayerId = li.dataset.id;
    prevDnDSnapshot = snapshot();
    li.classList.add('dragging');
  });
  layerList.addEventListener('dragover', e => {
    if (!dragLayerId) return;
    e.preventDefault();
    const li = e.target.closest('li');
    if (!li) return;
    const dragged = layerList.querySelector('li.dragging');
    if (!dragged || li === dragged) return;
    const r = li.getBoundingClientRect();
    if (e.clientY > r.top + r.height / 2) li.insertAdjacentElement('afterend', dragged);
    else li.insertAdjacentElement('beforebegin', dragged);
  });
  layerList.addEventListener('dragend', () => {
    if (dragLayerId) {
      syncLayersFromDom();
      if (prevDnDSnapshot != null && snapshot() !== prevDnDSnapshot) {
        undoStack.push(prevDnDSnapshot);
        if (undoStack.length > 60) undoStack.shift();
        redoStack = [];
        updateUndoButtons();
      }
    }
    dragLayerId = null; prevDnDSnapshot = null;
    layerList.querySelectorAll('li.dragging').forEach(x => x.classList.remove('dragging'));
  });
  layerList.addEventListener('drop', e => e.preventDefault());

  /* 文件输入 */
  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files];
    fileInput.value = '';
    if (!files.length) return;
    const cb = window._fileCb;
    window._fileCb = null;
    files.forEach((f, idx) =>
      readImageFile(f).then(src => {
        if (cb && idx === 0) cb(src);
        else addImageLayer(src);
      }));
  });

  bgFileInput.addEventListener('change', () => {
    const f = bgFileInput.files[0];
    bgFileInput.value = '';
    if (!f) return;
    readImageFile(f).then(src => {
      pushUndo();
      state.background.image = src;
      state.background.type = 'image';
      render();
      renderProps();
    });
  });

  bindCanvasMouse();
  bindDragDrop();
  bindKeyboard();
  bindMobileUI();

  new ResizeObserver(() => { if (zoomMode === 'fit') applyZoom(); }).observe(canvasArea);

  updateUndoButtons();
}

/* ==================== 移动端 UI 绑定 ==================== */
function openSheetTab(tab) {
  if (ui.sheet !== 'closed' && ui.sheetTab === tab) setSheet('closed', tab);
  else setSheet(ui.sheet === 'closed' ? 'half' : ui.sheet, tab);
}

function bindMobileUI() {
  const on = (id, evt, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(evt, fn);
  };

  /* 顶栏 */
  on('btnDrawer', 'click', () => setDrawer(ui.drawer === 'open' ? 'closed' : 'open'));
  on('btnDrawerClose', 'click', () => setDrawer('closed'));
  on('drawerBackdrop', 'click', () => setDrawer('closed'));
  on('mUndo', 'click', undo);
  on('mRedo', 'click', redo);
  on('mExport', 'click', openExportSheet);

  /* 底部工具坞 */
  on('mToolSelect', 'click', () => setTool('select'));
  on('mToolText', 'click', () => setTool('text'));
  on('mAddText', 'click', () => {
    pushUndo();
    const l = addTextLayerAt(state.canvas.w * 0.5, state.canvas.h * 0.5);
    l.autoCenter = true;
    centerLayer(l);
    state.focusText = true;
    renderProps();
    render();
    setSheet('full', 'props');
  });
  on('mAddImage', 'click', () => requestImageFile(src => addImageLayer(src)));
  on('mOpenLayers', 'click', () => openSheetTab('layers'));
  on('mOpenProps', 'click', () => openSheetTab('props'));

  /* 底部面板的标签 / 按钮 */
  document.querySelectorAll('.sheet-tab').forEach(b =>
    b.addEventListener('click', () => setSheet(ui.sheet === 'closed' ? 'half' : ui.sheet, b.dataset.sheetTab)));
  on('btnSheetClose', 'click', () => setSheet('closed'));
  on('btnSheetFull', 'click', () => setSheet(ui.sheet === 'full' ? 'half' : 'full'));
  on('sheetBackdrop', 'click', () => setSheet('closed'));

  /* 面板顶部手柄：下拉收起 / 上拉展开 */
  const grab = document.getElementById('sheetGrabber');
  if (grab) {
    let sy = 0;
    grab.addEventListener('pointerdown', e => {
      sy = e.clientY;
      try { grab.setPointerCapture(e.pointerId); } catch (err) {}
    });
    grab.addEventListener('pointerup', e => {
      const dy = e.clientY - sy;
      if (dy > 50) setSheet('closed');
      else if (dy < -50) setSheet('full');
    });
  }

  /* 浮动缩放控件 */
  on('mZoomIn', 'click', () => stepZoom(1.25));
  on('mZoomOut', 'click', () => stepZoom(1 / 1.25));
  on('mZoomFit', 'click', () => { zoomMode = 'fit'; applyZoom(); });

  /* 界面模式手动切换 */
  const modeSel = document.getElementById('uiModeSel');
  if (modeSel) modeSel.addEventListener('change', () => setForcedUIMode(modeSel.value));

  /* 输入框获得焦点时滚入可视区（安卓软键盘遮挡问题） */
  document.addEventListener('focusin', e => {
    if (!isMobileUI()) return;
    if (e.target.closest && e.target.closest('.props-section')) {
      setTimeout(() => {
        try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
      }, 260);
    }
  });

  /* 窗口尺寸 / 旋屏：重新判定模式 */
  const relayout = () => {
    updateViewportHeight();
    const next = detectUIMode();
    if (next !== ui.mode) applyUIMode(next);
    else { syncMobileUI(); if (zoomMode === 'fit') applyZoom(); }
  };
  window.addEventListener('resize', debounce(relayout, 120));
  window.addEventListener('orientationchange', () => setTimeout(relayout, 260));
  const vv = window.visualViewport;
  if (vv) vv.addEventListener('resize', () => { if (!isMobileUI()) updateViewportHeight(); });
  updateViewportHeight();
}

function init() {
  /* 界面模式：URL 参数 > 本地记忆 > 自动判定 */
  ui.forced = QUERY_MODE || readStoredUIMode();

  canvasEl = $('#canvas'); ctx = canvasEl.getContext('2d');
  canvasArea = $('#canvasArea');
  layerList = $('#layerList');
  propsContent = $('#propsContent'); propsTitle = $('#propsTitle');
  statusbar = $('#statusbar');
  zoomRange = $('#zoomRange'); zoomLabel = $('#zoomLabel');
  canvasPreset = $('#canvasPreset');
  fileInput = $('#fileInput'); bgFileInput = $('#bgFileInput');
  btnUndo = $('#btnUndo'); btnRedo = $('#btnRedo');
  toolSelect = $('#toolSelect'); toolText = $('#toolText');
  btnZoomFit = $('#btnZoomFit');
  btnExportPng = $('#btnExportPng'); btnExportJpg = $('#btnExportJpg');
  btnAddText = $('#btnAddText'); btnAddImage = $('#btnAddImage');
  btnDup = $('#btnDup'); btnDel = $('#btnDel');
  btnLayerUp = $('#btnLayerUp'); btnLayerDown = $('#btnLayerDown');
  btnCustomSize = $('#btnCustomSize'); btnNew = $('#btnNew');
  btnCenterBoth = $('#btnCenterBoth');

  buildPresetSelect();

  /* 示例文字图层，方便快速上手 */
  const sample = {
    id: uid(), type: 'text', name: '文字 1',
    text: '双击编辑文字',
    x: 0, y: 0,
    fontSize: 84,
    fontFamily: '"Microsoft YaHei", sans-serif',
    color: '#ffffff', bold: false, italic: false, align: 'center',
    lineHeight: 1.2, strokeColor: '#000000', strokeWidth: 0,
    shadowOn: false, shadowBlur: 8, shadowColor: '#000000',
    opacity: 1, visible: true,
    gradientOn: false, gradientAngle: 0,
    gradientStops: [{ pos: 0, color: '#ffd166' }, { pos: 100, color: '#ef476f' }],
    blur: 0, offsetX: 0, offsetY: 0, autoCenter: true,
  };
  const m = measureTextLayer(sample);
  sample.x = (state.canvas.w - m.w) / 2;
  sample.y = (state.canvas.h - m.h) / 2;
  state.layers.push(sample);

  applyCanvasSize(state.canvas.w, state.canvas.h, false);
  select(sample.id);
  setTool('select');
  bindAll();

  /* 所有元素绑定完成后，应用最终 UI 模式并自适应缩放 */
  applyUIMode(detectUIMode());

  /* 若上次有未保存的编辑，询问是否恢复 */
  maybeOfferAutosaveRestore();
}

init();

</script>
