<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>公告</title>
  <style>
    :root{
      --accent: #60a5fa;
      --accent-2: #3b82f6;
      --muted: rgba(230,238,248,0.6);
      --glass: rgba(255,255,255,0.02);
      --radius: 12px;
    }
    html, body { height: 100%; }
    body{
      margin: 0;
      background:
        linear-gradient(180deg, rgba(7,16,38,0.6) 0%, rgba(7,16,38,0.6) 100%),
        url('https://i.mituw.com/imgs/2026/02/19/31afc956e5f2261b.png') center/cover no-repeat fixed;
      color: #e6eef8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    .wrap{
      width: 100%;
      max-width: 880px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }
    header{
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .logo{
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      box-shadow: 0 6px 18px rgba(96,165,250,0.12);
      flex: 0 0 64px;
    }
    h1{
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.6px;
    }
    .subtitle{
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .content{
      margin-top: 18px;
    }
    .intro{
      background: var(--glass);
      padding: 12px 14px;
      border-radius: 10px;
      color: #dceafc;
      font-size: 15px;
      margin-bottom: 16px;
    }
    .links{
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .links a{
      text-decoration: none;
      color: inherit;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01));
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.02);
      transition: transform .16s ease, box-shadow .16s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover{
      transform: translateY(-6px);
      box-shadow: 0 14px 40px rgba(2,6,23,0.6);
    }
    .card .title{
      font-weight: 600;
      color: #f3f9ff;
      font-size: 15px;
    }
    .card .desc{
      font-size: 13px;
      color: var(--muted);
    }
    footer{
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .small{
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width:520px){
      .logo{width:52px;height:52px;font-size:18px;}
      .wrap{padding:18px;}
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <header>
      <div class="logo">S3</div>
      <div>
        <h1>Small 3 的个人领域</h1>
        <div class="subtitle">公告</div>
      </div>
    </header>

    <section class="content">
      <div class="intro">
        我是 Small 3，感觉游戏没什么用，所以这里只放公告。对了，背景图片是我自己放的哦!
      </div>

      <h2 style="margin:0 0 10px 0;font-size:14px;color:var(--muted)">—— 公告 ——</h2>
     <style>
    .search-container {
        margin-bottom: 18px;
    }
    
    .search-form {
        display: flex;
        gap: 6px;
        margin-bottom: 15px;
    }
    
    .search-input {
        flex: 1;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid #3b82f6;
        outline: none;
        font-size: 15px;
    }
    
    .search-button {
        padding: 7px 16px;
        border-radius: 8px;
        border: none;
        background: #10B981;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    
    .search-button:hover {
        background: #059669;
    }
    
    .search-results {
        width: 100%;
        height: 600px;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 10px;
    }
    
    .results-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    
    .loading {
        display: none;
        text-align: center;
        padding: 20px;
        color: #666;
    }
    
    .error-message {
        display: none;
        background-color: #fee;
        border: 1px solid #fcc;
        border-radius: 8px;
        padding: 15px;
        margin-top: 10px;
        color: #c00;
    }
    
    .no-results-message {
        text-align: center;
        padding: 40px 20px;
        color: #666;
    }
</style>

<div class="search-container">
    <form id="songSearchForm" class="search-form">
        <input type="text" id="searchKeyword" class="search-input" placeholder="搜索歌曲、歌手或专辑...">
        <button type="submit" class="search-button">搜索歌曲</button>
    </form>
    
    <div id="loading" class="loading">
        正在加载搜索结果...
    </div>
    
    <div id="errorMessage" class="error-message">
        抱歉，无法加载搜索结果。请检查网络连接或稍后重试。
    </div>
    
    <div id="searchResults" class="search-results">
        <div id="initialMessage" class="no-results-message">
            <h3>歌曲搜索</h3>
            <p>请输入关键词搜索歌曲、歌手或专辑</p>
            <p>示例：周杰伦、青花瓷、Taylor Swift</p>
        </div>
        
        <iframe id="resultsFrame" class="results-iframe" style="display: none;"></iframe>
    </div>
</div>

<script>
    document.getElementById('songSearchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var keyword = document.getElementById('searchKeyword').value.trim();
        
        if (!keyword) {
            alert('请输入要搜索的歌曲名称或歌手名称');
            return;
        }
        
        // 显示加载状态
        document.getElementById('loading').style.display = 'block';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('initialMessage').style.display = 'none';
        document.getElementById('resultsFrame').style.display = 'none';
        
        // 构建歌曲海搜索URL
        var searchUrl = 'https://www.gequhai.com/s/' + encodeURIComponent(keyword);
        
        // 获取iframe元素
        var iframe = document.getElementById('resultsFrame');
        
        // 设置iframe的src
        iframe.src = searchUrl;
        
        // 监听iframe加载完成
        iframe.onload = function() {
            document.getElementById('loading').style.display = 'none';
            iframe.style.display = 'block';
        };
        
        // 监听iframe加载错误
        iframe.onerror = function() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        };
    });
    
    // 添加回车键搜索支持
    document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('songSearchForm').dispatchEvent(new Event('submit'));
        }
    });
    
    // 页面加载完成后，给搜索框自动焦点
    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('searchKeyword').focus();
    });
</script>

      <ul class="links" aria-label="公告">
        <li>
          <a class="card" href="https://small534460.github.io/" target="_blank" rel="noopener noreferrer">
            <div class="title">大黄蜂的图片好好看啊😍</div>
          </a>
        </li>
      </ul>
    </section>

    <footer>
      <div class="small">本站由 <a href="https://github.com" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none">GitHub</a> 支持</div>
      <div class="small">© Small 3</div>
    </footer>
  </main>
</body>
</html>
