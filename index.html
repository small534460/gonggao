  <style>
    :root{

    }
    .wrap{
      width: 100%;
      max-width: 880px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }
    header{
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .logo{
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;

    h1{
      margin: 0;

      font-weight: 600;

    footer{
      margin-top: 18px;

    }
    @media (max-width:520px){
      .logo{width:52px;height:52px;font-size:18px;}
      .wrap{padding:18px;}
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <header>
      <div class="logo">S3</div>
      <div>
        <h1>Small 3 的个人领域</h1>
        <div class="subtitle">公告</div>
      </div>
    </header>

    <section class="content">
      <div class="intro">
        我是 Small 3，这是我的个人领域。这里存放公告。
      </div>

      <h2 style="margin:0 0 10px 0;font-size:14px;color:var(--muted)">—— 公告 ——</h2>

      <ul class="links" aria-label="公告">
        <li>
          <a class="card" href="https://small534460.github.io/" target="_blank" rel="noopener noreferrer">
            <div class="title">————好吧，什么也没有————</div>
            <canvas id="lifeCanvas" width="440" height="440" style="border-radius:12px;box-shadow:0 6px 18px rgba(96,165,250,0.12);margin-top:10px;"></canvas>
            <script>
/**
 * 平衡优化生物生态模拟
 * Small 3 修改/升级版，带详细注释及新功能！
 */

//==== 基本参数 ====
const canvas = document.getElementById('lifeCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 440;                   // 地图宽度/高度(px)
const ENTITY_SIZE = 7;                   // 生物、猎人、食物的半径(px)
const NUM_ANIMALS = 14;                  // 启动时蓝生物数量
const NUM_HUNTERS = 3;                   // 启动时红猎人数量
const FOOD_MAX = 22;                     // 食物最大数量（极端收敛保护）
const FOOD_REFRESH = 14;                 // 默认刷新到多少个食物
const MOVE_SPEED = 1.9;                  // 蓝生物移动速度(px/步)
const HUNTER_SPEED = 1.8;                // 红猎人移动速度(px/步)
const DAY_LENGTH = 300;                  // 一天步数
const NORMAL_NEED = 1;                   // 蓝生物一天消耗能量
const HUNTER_NEED = 2;                   // 红猎人一天消耗能量
const NORMAL_BORN = 5;                   // 蓝生物繁殖能量阈值
const HUNTER_BORN = 7;                   // 红猎人繁殖能量阈值
const BORN_ENERGY_COST = 2;              // 繁殖需要消耗能量
const ANIMAL_VIEW_DIST = 60;             // 蓝生物逃猎视野（px）
const HUNTER_VIEW_DIST = GRID_SIZE * 2;  // 红猎人视野(全图视野，覆盖地图上所有蓝生物)
const ESCAPE_FORCE = 3.2;                // 蓝生物逃跑时加速系数
const HUNTER_ATTACK_DIST = ENTITY_SIZE * 1.7; // 猎人捕杀距离(px)
const BABY_GUARD_AGE = 1;                // 宝宝保护期(天)
const MAX_TOTAL = 60;                    // 生物总数上限

//==== 工具函数 ====
function randomPos() {
  return Math.random() * (GRID_SIZE - 2*ENTITY_SIZE) + ENTITY_SIZE;
}

//==== 类定义 ====
class Food {
  constructor(x, y) {
    this.x = x;
    this.y = y;
  }
}

class Animal {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.energy = 2;               // 初始能量
    this.type = "normal";
    this.alive = true;
    this.age = 0;                  // 存活天数
    this.childAge = 0;             // 宝宝期计数
  }
  get need() { return NORMAL_NEED; }
  get born() { return NORMAL_BORN; }
  color() { return "#3b82f6"; }
  isChild() { return this.childAge > 0 && this.childAge <= BABY_GUARD_AGE; }
  act(hunters, foods) {
    if (!this.alive) return;
    let tx = 0, ty = 0;
    // 逃最近猎人
    let escape = false;
    for (const h of hunters) {
      const d = Math.hypot(h.x - this.x, h.y - this.y);
      if (d < ANIMAL_VIEW_DIST) {
        tx -= (h.x - this.x);
        ty -= (h.y - this.y);
        escape = true;
      }
    }
    // 没猎人则追食物
    if (!escape) {
      let best = null, bd = 99999;
      for (const f of foods) {
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < bd) { bd = d; best = f; }
      }
      if (best) { tx += (best.x - this.x); ty += (best.y - this.y);}
    } else {
      tx *= ESCAPE_FORCE; ty *= ESCAPE_FORCE;
    }
    // 移动
    const norm = Math.max(1, Math.hypot(tx, ty));
    this.x += MOVE_SPEED * tx / norm;
    this.y += MOVE_SPEED * ty / norm;
    this.x = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.x));
    this.y = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.y));
  }
}

class Hunter {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.energy = 3;               // 初始能量
    this.type = "hunter";
    this.alive = true;
    this.age = 0;
    this.childAge = 0;
    // 新增一天的记录
    this.ateBlue = false;          // 今天是否吃到蓝生物
    this.ateFood = 0;              // 今天吃到的食物数量
  }
  get need() { return HUNTER_NEED; }
  get born() { return HUNTER_BORN; }
  color() { return "#ef4444"; }
  isChild() { return this.childAge > 0 && this.childAge <= BABY_GUARD_AGE; }
  act(animals, foods) {
    if (!this.alive) return;
    // 追全图内最近蓝生物（视野覆盖全地图）
    let best = null, bd = 99999;
    for (const a of animals) {
      if (a.alive && !a.isChild()) {
        const d = Math.hypot(a.x - this.x, a.y - this.y);
        if (d < bd && d < HUNTER_VIEW_DIST) { bd = d; best = a; }
      }
    }
    if (best) {
      const dx = best.x - this.x, dy = best.y - this.y, norm = Math.max(1, Math.hypot(dx, dy));
      this.x += HUNTER_SPEED * dx / norm;
      this.y += HUNTER_SPEED * dy / norm;
    } else {
      // 改为追食物（如果没蓝生物）
      let fbest = null, fd = 99999;
      for (const f of foods) {
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < fd) { fd = d; fbest = f;}
      }
      if (fbest) {
        const dx = fbest.x - this.x, dy = fbest.y - this.y, norm = Math.max(1, Math.hypot(dx, dy));
        this.x += HUNTER_SPEED * dx / norm;
        this.y += HUNTER_SPEED * dy / norm;
      }
    }
    this.x = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.x));
    this.y = Math.max(ENTITY_SIZE, Math.min(GRID_SIZE-ENTITY_SIZE, this.y));
  }
}

//==== 主体数据 ====
let foods=[], animals=[], hunters=[];
let dayStep=0, ticks=0, totalBorn = 0;

function replenishFood(force=false) {
  let need = FOOD_REFRESH - foods.length;
  if (need<=0 && !force) return;
  for(let i=0;i<need || (force && foods.length === 0) ;i++){
    foods.push(new Food(randomPos(), randomPos()));
  }
}

function init() {
  foods = [];
  animals = [];
  hunters = [];
  dayStep=0; totalBorn=0;
  for(let i=0;i<NUM_ANIMALS;i++) animals.push(new Animal(randomPos(), randomPos()));
  for(let i=0;i<NUM_HUNTERS;i++) hunters.push(new Hunter(randomPos(), randomPos()));
  replenishFood(true);
}
init();

//==== 更新逻辑 ====
function update() {
  ticks++;
  dayStep++;
  // 行动(取消碰撞箱)
  for(const a of animals) a.act(hunters, foods);
  for(const h of hunters) h.act(animals, foods);

  // 蓝生物吃食物
  for(const a of animals) {
    if (!a.alive) continue;
    for (const f of foods) {
      if (Math.hypot(a.x - f.x, a.y - f.y) < ENTITY_SIZE*1.4) {
        foods = foods.filter(food => food !== f);
        a.energy++; break;
      }
    }
  }
  // 猎人吃蓝生物或食物，记录是否吃到蓝生物/吃到的食物数
  for(const h of hunters) {
    if (!h.alive) continue;
    h.ateBlue = false;
    h.ateFood = 0;

    // 检查猎杀蓝生物
    for (const a of animals) {
      if(a.alive && !a.isChild() && Math.hypot(h.x - a.x, h.y - a.y) < HUNTER_ATTACK_DIST){
        a.alive = false;
        h.energy += 3; // 吃蓝生物能量+3
        h.ateBlue = true;
        break;
      }
    }
    // 检查吃食物
    if (!h.ateBlue) {
      for (const f of foods) {
        if (Math.hypot(h.x - f.x, h.y - f.y) < ENTITY_SIZE*1.3) {
          foods = foods.filter(food => food !== f);
          h.energy+=1; // 吃食物能量+1
          h.ateFood++;
          break;
        }
      }
    }
  }

  // 不等一天刷新，食物吃光就补充
  if (foods.length === 0) replenishFood(true);

  //--- 每天结束结算 ---
  if (dayStep >= DAY_LENGTH) {
    let newbornAnimals=[], newbornHunters=[];
    // 蓝生物结算/繁殖
    for (const a of animals) {
      a.age++;
      if (!a.alive) continue;
      a.energy -= a.need;
      if (a.energy < 0) a.alive = false;    // 能量不足死亡
      if (a.energy >= a.born && newbornAnimals.length < 3 && (animals.length+hunters.length)<MAX_TOTAL) {
        a.energy -= BORN_ENERGY_COST;
        let baby = new Animal(a.x, a.y); baby.childAge = 1; newbornAnimals.push(baby); // 原地生宝宝
      }
      if (a.isChild()) a.childAge++; // 宝宝长大
    }
    // 猎人结算/新逻辑
    for (const h of hunters) {
      h.age++;
      // 天结束先消耗能量
      h.energy -= h.need;
      if (!h.alive) continue;
      // 只吃到食物（没吃蓝生物）
      if (!h.ateBlue && h.ateFood > 0) {
        if (h.energy < 0) {
          h.alive = false;         // 本来能量不够就死
        } else if (Math.random() < 1/3) {
          h.alive = false;         // 有1/3概率死掉
        }
        // 达到繁殖阈值但没吃蓝生物，1/3概率繁殖
        if (h.energy >= h.born && Math.random() < 1/3 && (animals.length+hunters.length)<MAX_TOTAL) {
          h.energy -= BORN_ENERGY_COST + 1;
          let baby = new Hunter(h.x, h.y); baby.childAge = 1; newbornHunters.push(baby);
        }
        if (h.isChild()) h.childAge++;
      }
      // 如果吃到蓝生物参与正常繁殖
      else if (h.ateBlue) {
        if (h.energy < 0) {
          h.alive = false;
        } else if (h.energy >= h.born && newbornHunters.length < 1 && (animals.length+hunters.length)<MAX_TOTAL) {
          h.energy -= BORN_ENERGY_COST + 1;
          let baby = new Hunter(h.x, h.y); baby.childAge = 1; newbornHunters.push(baby);
        }
        if (h.isChild()) h.childAge++;
      }
      // 什么都没吃到（能量不够就死，否则继续活着，不会繁殖，不会额外死亡）
      else {
        if (h.energy < 0) h.alive = false;
        if (h.isChild()) h.childAge++;
      }
    }
    // 更新
    animals = animals.filter(a=>a.alive);
    hunters = hunters.filter(h=>h.alive);
    animals = animals.concat(newbornAnimals);
    hunters = hunters.concat(newbornHunters);
    dayStep = 0;
  }

  // 超量食物裁减
  if(foods.length>FOOD_MAX) foods=foods.slice(0,FOOD_MAX);

  animals = animals.filter(a=>a.alive);
  hunters = hunters.filter(h=>h.alive);
}

//==== 渲染逻辑 ====
function render() {
  ctx.clearRect(0,0,GRID_SIZE,GRID_SIZE);
  // 食物
  for(const f of foods){
    ctx.beginPath();
    ctx.arc(f.x, f.y, ENTITY_SIZE-2, 0, Math.PI*2);
    ctx.fillStyle="#34d399";
    ctx.fill();
    ctx.closePath();
  }
  // 蓝生物
  for(const a of animals){
    ctx.save();
    ctx.globalAlpha=a.isChild()?0.45:1.0;
    ctx.beginPath();
    ctx.arc(a.x,a.y,ENTITY_SIZE,0,Math.PI*2);
    ctx.fillStyle=a.color();
    ctx.fill();
    ctx.closePath();
    ctx.restore();
  }
  // 红猎人
  for(const h of hunters){
    ctx.save();
    ctx.globalAlpha=h.isChild()?0.45:1.0;
    ctx.beginPath();
    ctx.arc(h.x,h.y,ENTITY_SIZE,0,Math.PI*2);
    ctx.fillStyle=h.color();
    ctx.fill();
    ctx.closePath();
    ctx.restore();
  }
  // ui
  ctx.font="bold 13px Arial";
  ctx.fillStyle="#facc15";
  ctx.fillText(`天数:${ticks ? Math.floor(ticks/DAY_LENGTH)+1 : 1}`,10,20);
  ctx.fillText(`蓝生物: ${animals.length}`,110,20);
  ctx.fillStyle="#ee4444";
  ctx.fillText(`红猎人: ${hunters.length}`,220,20);
  ctx.fillStyle="#14b8a6";
  ctx.fillText(`食物: ${foods.length}`,320,20);
  if (animals.length===0 && hunters.length===0){
    ctx.font = "18px Arial";
    ctx.fillStyle = "#ef4444";
    ctx.fillText("所有生物都灭绝了", 90, 220);
  }
}

// 永远循环
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
            </script>
          </a>
        </li>
      </ul>
    </section>

  </main>
